<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CarmaCars</title>
<style>
  :root { --red: #d0111b; --ink: #fff; --muted: #a3a3a3; --bg: #000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
  .mark { font-weight: 800; font-size: 44px; letter-spacing: -2px; line-height: 1; }
  .mark span { color: var(--red); }
  .rule { width: 56px; height: 5px; background: var(--red); margin: 10px auto 40px; }
  h1 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; font-weight: 700; }
  p { margin: 0 auto 28px; max-width: 30ch; color: var(--muted); }
  button { appearance: none; border: 0; border-radius: 6px; background: var(--red); color: #fff; font: inherit; font-weight: 700;
    min-height: 48px; padding: 12px 32px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button[disabled] { opacity: .6; }
  .status { min-height: 24px; margin-top: 12px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true">C<span>C</span></div>
  <div class="rule" aria-hidden="true"></div>
  <main>
    <h1 id="title">You're offline</h1>
    <p id="text">CarmaCars needs a connection to show your bookings. We'll reconnect as soon as you're back online.</p>
    <button type="button" id="retry">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
<script>
  // The app's bundled screen (capacitor.config.ts server.errorPath): no connection, or the site did not answer.
  // Try again goes back to the page that failed (or the app's start), and coming back online does the same by itself.
  (function () {
    var START = 'https://carmacars.ca/app';
    var btn = document.getElementById('retry'), status = document.getElementById('status');
    // online, but the site did not answer: say so instead of "offline"
    if (navigator.onLine !== false) {
      document.getElementById('title').textContent = 'CarmaCars did not load';
      document.getElementById('text').textContent = 'The connection dropped or the site is busy. Try again in a moment.';
    }
    function back() {
      var to = START;
      try { var r = document.referrer; if (r && /^https:\/\/(www\.)?carmacars\.ca\//.test(r)) to = r; } catch (e) {}
      btn.disabled = true; status.textContent = 'Connecting…';
      window.location.replace(to);
      setTimeout(function () { btn.disabled = false; status.textContent = navigator.onLine === false ? 'Still offline.' : ''; }, 6000);
    }
    btn.addEventListener('click', back);
    window.addEventListener('online', back);
  })();
</script>
</body>
</html>

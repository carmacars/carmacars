name: guides

# Screenshots for the user guides (web/scripts/guide-shots.mjs): the local stack of this commit (the same build as
# carmacars.ca), filled by the end-to-end suite with realistic records, every person then renamed to a fictional
# name at example.com. Each portal's person signs in and the key screens are taken at desktop 1440 x 900 (scale 2)
# and phone 390 x 844 (scale 3), with the public pages and the request-to-book steps. The files go to the private
# Storage bucket deploy-reports under guides/<date>/<portal>/<nn>-<name>-<desktop|phone>.webp with manifest.json (WebP
# copies of the PNGs; only the newest date is kept, scripts/backup/prune-reports.sh).
# Nothing touches the live database while the screens are taken; the payment screen uses Stripe's test keys only.
#
# Guide upkeep (upkeep = true, the default; web/scripts/guide-upkeep.mjs, migration 0049): each new screenshot is cropped
# as the guides crop it and compared with the image the live guide shows (a perceptual difference above 3%). A changed
# one is sent to carmacars.ca's job endpoint: stored, put in place of the old image in the guides (drafts and published
# copies), and its sections' text checked again by the next automatic run. Run guides-pdf afterwards for the PDFs.
#
# The guides keep up by themselves (auto = true; migration 0055): the deploy job of ci.yml starts this workflow after
# every successful deploy. The first job stops it within a minute when nothing under web/src or docs/guides changed
# since the commit of the last finished run. Otherwise: the screenshots as above, then the text of every section whose
# screenshot changed or that names a button no screen shows any more is rewritten by Workers AI, held to facts read from
# the code (web/scripts/portal-facts.mjs), and published when it passes the checks (Admin > Settings > Guides shows
# "Changed automatically on <date>" with a Revert); then the PDFs of the guides that changed are printed again
# (web/scripts/guides-pdf.mjs, as guides-pdf.yml does), and the run is recorded with its commit.
on:
  workflow_dispatch:
    inputs:
      portals:
        description: Only these portals (comma separated; empty for all) public,renter,owner,investor,admin,va-cs,va-finance,va-fleet,va-sales,field
        type: string
        default: ''
      upkeep:
        description: Compare with the live guides and replace the screenshots that changed
        type: boolean
        default: true
      rewrite:
        description: Also rewrite the text of the sections that changed or name missing buttons (Workers AI, published when it passes the checks)
        type: boolean
        default: false
      keep:
        description: Also keep the screenshots (PNG, manifest.json) as a run artifact, to retake the guides' crops and the investor deck's screens in the repository
        type: boolean
        default: false
      auto:
        description: After a deploy (ci.yml starts it) - skip when nothing changed, rewrite the text, print the PDFs, record the run
        type: boolean
        default: false

concurrency:
  group: guides
  cancel-in-progress: false

# Where Supabase is: the hosted project (default) or the company's own server (repository variable DB_BACKEND=vps;
# infra/vps/CUTOVER.md). VPS_SSH_KEY is used only with vps (scripts/deploy/vps.sh).
env:
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.c.outputs.run }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything to do?
        id: c
        run: |
          if [ "${{ inputs.auto }}" != true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          L=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" vault deploy_link_signing_key)
          echo "::add-mask::$L"
          T=$(printf '%s' 'carmacars-listing-worker-v1' | openssl dgst -sha256 -hmac "$L" | sed 's/^.* //')
          echo "::add-mask::$T"
          LAST=$(curl -sS https://carmacars.ca/api/jobs/guide-upkeep-run -H "Authorization: Bearer $T" | jq -r '.sha // empty')
          if [ -n "$LAST" ] && git cat-file -e "$LAST^{commit}" 2>/dev/null && git diff --quiet "$LAST" HEAD -- web/src docs/guides/src; then
            echo "::notice title=guides::nothing under web/src or docs/guides/src changed since ${LAST::7}: the guides are up to date"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=guides::changes since ${LAST:-the first run}: ${{ github.sha }}"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  shots:
    permissions:
      contents: write
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CARMACARS_LOCAL_DIR: /tmp/cc-local
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: PostgreSQL 16
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-client-16 fonts-noto-color-emoji
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Local stack (migrations, local auth, seed)
        run: |
          cp .env.example .env.local
          bash scripts/local-db.sh up
      - name: Build
        run: ../.github/ci-run.sh "Build" npm run build
      - name: Browsers
        run: npx playwright install --with-deps chromium
      - name: Server
        run: |
          (node scripts/serve.mjs > /tmp/serve.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
      - name: Sample records (the end-to-end suite, desktop; a failed test only means fewer records)
        continue-on-error: true
        run: BASE_URL=http://localhost:3000 npx playwright test --project desktop-1440 --reporter=dot > /tmp/e2e.log 2>&1 || tail -n 15 /tmp/e2e.log
      - name: A second server with Stripe test keys, for the payment screen
        run: |
          q() { "$GITHUB_WORKSPACE/scripts/deploy/sb.sh" vault "$1"; }
          SK=$(q deploy_stripe_secret_key); PK=$(q deploy_stripe_publishable_key)
          echo "::add-mask::$SK"
          if [[ "$SK" == sk_test_* && "$PK" == pk_test_* ]]; then
            (PORT=3001 PAYMENTS_PROVIDER=stripe STRIPE_SECRET_KEY="$SK" NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$PK" node scripts/serve.mjs > /tmp/serve-pay.log 2>&1 &)
            for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/robots.txt && break; sleep 1; done
            echo "PAY_URL=http://localhost:3001" >> "$GITHUB_ENV"
          else
            echo "::notice title=guides::no Stripe test keys in the vault: the payment screen shows the local card form"
          fi
      - name: Screenshots
        run: |
          D=$(TZ=America/Toronto date +%Y-%m-%d); echo "GUIDE_DATE=$D" >> "$GITHUB_ENV"
          BASE_URL=http://localhost:3000 ../.github/ci-run.sh "Screenshots" node scripts/guide-shots.mjs --out "$RUNNER_TEMP/guides" ${{ inputs.portals && format('--portals {0}', inputs.portals) || '' }}
          jq -r '"\(.screens | length) screenshots, \(.problems | length) problems"' "$RUNNER_TEMP/guides/manifest.json" | sed 's/^/::notice title=guides::/'
          jq -r '.problems[:10][]' "$RUNNER_TEMP/guides/manifest.json" | sed 's/^/::warning title=guides::/'
      - name: The link key (the jobs' token is derived from it)
        if: ${{ inputs.upkeep || inputs.auto }}
        run: |
          L=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" vault deploy_link_signing_key)
          if [ -z "$L" ]; then echo "::error title=guide upkeep::The link key is not in the vault (deploy_link_signing_key)"; exit 1; fi
          echo "::add-mask::$L"
          echo "LINK_SIGNING_KEY=$L" >> "$GITHUB_ENV"
      - name: Guide upkeep (replace changed screenshots in the live guides; with the text, rewrite the sections that changed)
        if: ${{ inputs.upkeep || inputs.auto }}
        run: |
          python3 -c 'import PIL' 2>/dev/null || sudo apt-get install -y -q python3-pil > /dev/null
          W="${{ (inputs.rewrite || inputs.auto) && '--rewrite' || '' }}"
          ../.github/ci-run.sh "Guide upkeep" node scripts/guide-upkeep.mjs --shots "$RUNNER_TEMP/guides" --out "$RUNNER_TEMP/upkeep" --apply $W --base https://carmacars.ca --run "${{ github.run_id }}" | tee "$RUNNER_TEMP/upkeep.txt"
          sed 's/^/::notice title=guide upkeep::/' "$RUNNER_TEMP/upkeep.txt"
          cp "$RUNNER_TEMP/upkeep/report.json" "$RUNNER_TEMP/guides/upkeep.json"
          # the guides whose published text changed in this run: their PDFs are printed again
          P=$(jq -r '[(.applied[]? | select(.ok) | .name | if startswith("public-") then "renter" elif startswith("va-") then "va" else split("-")[0] end), (.rewritten[]?.portal)] | unique | join(",")' "$RUNNER_TEMP/upkeep/report.json")
          echo "GUIDE_PORTALS=$P" >> "$GITHUB_ENV"
      - name: The PDFs of the guides that changed
        if: ${{ inputs.auto && env.GUIDE_PORTALS != '' }}
        run: |
          ../.github/ci-run.sh "Guide PDFs" node scripts/guides-pdf.mjs --base https://carmacars.ca --out "$RUNNER_TEMP/pdf" --portals "$GUIDE_PORTALS" | tee "$RUNNER_TEMP/pdf.txt"
          sed 's/^/::notice title=guides-pdf::/' "$RUNNER_TEMP/pdf.txt"
          echo "GUIDE_PDFS=$(ls "$RUNNER_TEMP/pdf"/*.pdf 2>/dev/null | wc -l)" >> "$GITHUB_ENV"
      - name: Record the run
        if: ${{ inputs.auto }}
        run: node scripts/guide-upkeep.mjs --finish --out "$RUNNER_TEMP/upkeep" --run "${{ github.run_id }}" --sha "${{ github.sha }}" --pdfs "${GUIDE_PDFS:-0}" --base https://carmacars.ca | sed 's/^/::notice title=guides::/'
      - name: Record the failed run
        if: ${{ failure() && inputs.auto && env.LINK_SIGNING_KEY != '' }}
        run: node scripts/guide-upkeep.mjs --finish --status failed --out "$RUNNER_TEMP/upkeep" --run "${{ github.run_id }}" --sha "${{ github.sha }}" --base https://carmacars.ca || true
      - name: The investor deck's own screens (keep = true; web/scripts/deck-shots.mjs on the same local stack)
        if: ${{ inputs.keep }}
        continue-on-error: true
        run: BASE_URL=http://localhost:3000 DATABASE_URL=postgresql://postgres@127.0.0.1:54322/carmacars node scripts/deck-shots.mjs
      - name: Keep the screenshots on the branch guide-shots-${{ github.run_number }} (keep = true; WebP, manifest.json, the deck's screens; delete the branch after use)
        if: ${{ inputs.keep }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          K="$RUNNER_TEMP/keep"; rm -rf "$K"; mkdir -p "$K/guide" "$K/deck"
          command -v cwebp > /dev/null || sudo apt-get install -y -q webp > /dev/null 2>&1
          cd "$RUNNER_TEMP/guides"
          for f in */*.png; do mkdir -p "$K/guide/$(dirname "$f")"; cwebp -quiet -q 92 -m 4 "$f" -o "$K/guide/${f%.png}.webp"; done
          cp manifest.json "$K/guide/manifest.json"
          cp "$GITHUB_WORKSPACE"/web/public/deck/*.jpg "$K/deck/"
          cd "$K"; git init -q -b guide-shots-${{ github.run_number }}; git config user.name "guides workflow"; git config user.email "noreply@github.com"
          git add -A; git commit -q -m "guide screenshots of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" guide-shots-${{ github.run_number }}
          echo "::notice title=guides::screens kept on the branch guide-shots-${{ github.run_number }} ($(du -sh "$K" | cut -f1))"
      - name: Upload to deploy-reports/guides/<date>
        run: |
          set -euo pipefail
          K=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" service-key)
          echo "::add-mask::$K"
          S=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" storage-url)
          curl -sS -o /dev/null -X POST "$S/bucket" -H "Authorization: Bearer $K" -H "apikey: $K" -H 'content-type: application/json' --data '{"id":"deploy-reports","name":"deploy-reports","public":false}' || true
          # the archive copy as WebP (quality 90, about two thirds of the PNG): the upkeep above already compared the PNGs,
          # and only the newest date is kept (scripts/backup/prune-reports.sh in the nightly backup workflow)
          cd "$RUNNER_TEMP/guides"; n=0
          before=$(du -sb . | cut -f1)
          command -v cwebp > /dev/null || sudo apt-get install -y -q webp > /dev/null 2>&1 || true
          if command -v cwebp > /dev/null; then
            for f in */*.png; do [ -f "$f" ] && cwebp -quiet -q 90 -m 4 "$f" -o "${f%.png}.webp" && rm "$f"; done
            jq '(.. | strings | select(endswith(".png"))) |= sub("\\.png$"; ".webp")' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          fi
          echo "::notice title=guides::archive $(( before / 1048576 )) MB as PNG, $(( $(du -sb . | cut -f1) / 1048576 )) MB to upload"
          for f in manifest.json upkeep.json */*.webp */*.png; do
            [ -f "$f" ] || continue
            ct=image/png; case "$f" in *.json) ct=application/json;; *.webp) ct=image/webp;; esac
            for try in 1 2 3; do
              curl -sS -f -o /dev/null -X POST "$S/object/deploy-reports/guides/$GUIDE_DATE/$f" -H "Authorization: Bearer $K" -H "apikey: $K" -H "content-type: $ct" -H 'x-upsert: true' --data-binary "@$f" && break
              sleep 3
            done
            n=$((n + 1))
          done
          echo "::notice title=guides::uploaded $n files to deploy-reports/guides/$GUIDE_DATE ($(du -sh . | cut -f1))"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: guides-debug
          path: |
            /tmp/serve.log
            /tmp/e2e.log

name: catalog

# The vehicle catalog behind the vehicle pages (/cars/<make>/<model>/<year>/<trim>, migration 0097;
# docs/changes/2026-10-21-vehicle-pages.md). web/scripts/catalog/import.mjs downloads the US EPA fueleconomy.gov vehicles
# file (public domain) and NHTSA vPIC's model names (public domain), adds the Canadian trim names of
# web/scripts/catalog/canada-trims.txt, and upserts the result into the vehicle_catalog_* tables in batches through the
# Supabase Management API (the deploy's connection, scripts/deploy/lib.sh), or COPY over the pooler with the database
# password; gently since 0106 (2,000 rows a transaction, a pause and a busy check before each). The pages then rebuild
# (/api/jobs/public-rebuild) and the top pages are warmed (/api/jobs/warm-up, the Worker's post-deploy warm-up).
#
#   schedule        every day at 07:17 UTC a one-query check; the import runs when the last one is older than the
#                   Admin setting (30 days by default: monthly) or an Admin pressed "Import now" in Admin > Settings >
#                   Vehicle pages. Otherwise the run stops within seconds.
#   Run workflow    write = true (default): import now.  write = false: a dry run.
#   push            (any branch, when the import's code changes) a dry run only: download, normalise, counts, the
#                   fixture subset as annotations. Never writes.
#
# Further sources (0115; docs/seo/coverage-2026-10-23.md): the vPIC database export (vpicdb), NRCan's Fuel Consumption
# Ratings (nrcan) and Wikidata's models before 1981 (wikidata). The import includes the ones Program settings
# vpage_extra_sources lists (empty by default: they wait until the database has moved off the 1 GB server), or the ones a
# manual run names. Every import replaces the whole catalog, so once a source is on it stays on in the setting.
#
# Production is written only here, never from a developer's machine.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      write:
        description: Write the catalog to the production database (false for a dry run)
        type: boolean
        default: true
      extra:
        description: Further sources, comma separated (vpicdb,nrcan,wikidata); empty uses Program settings vpage_extra_sources, none for none
        type: string
        default: ''
  push:
    paths:
      - '.github/workflows/catalog.yml'
      - 'web/scripts/catalog/**'
      - 'web/src/features/vehicles/normalise.ts'
      - 'web/src/features/vehicles/units.ts'

concurrency:
  group: catalog-${{ github.event_name == 'push' && github.ref || 'write' }}
  cancel-in-progress: false

# Where Supabase is: the hosted project (default) or the company's own server (repository variable DB_BACKEND=vps;
# infra/vps/CUTOVER.md). VPS_SSH_KEY is used only with vps (scripts/deploy/vps.sh).
env:
  DB_BACKEND: ${{ vars.DB_BACKEND || 'supabase' }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Due?
        id: due
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # the further sources (0115): a manual run's list, else the setting (never on a push)
          extra="${{ inputs.extra }}"
          if [ "${{ github.event_name }}" != push ] && [ -z "$extra" ]; then
            extra=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
              --data '{"query":"select coalesce(array_to_string(vpage_extra_sources, $$,$$), $$$$) as x from program_settings limit 1"}' | jq -r '.[0].x // empty' 2>/dev/null || true)
          fi
          [ "$extra" = none ] && extra=''
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
          [ -n "$extra" ] && echo "::notice title=catalog::further sources: $extra"
          case "${{ github.event_name }}" in
            push) echo "mode=dry" >> "$GITHUB_OUTPUT"; exit 0 ;;
            workflow_dispatch) [ "${{ inputs.write }}" = true ] && echo "mode=write" >> "$GITHUB_OUTPUT" || echo "mode=dry" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          due=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" sql 'select app.vehicle_catalog_import_due() as due' | jq -r '.[0].due // false')
          if [ "$due" = true ]; then echo "mode=write" >> "$GITHUB_OUTPUT"; else echo "mode=skip" >> "$GITHUB_OUTPUT"; echo "::notice title=catalog::not due: the last import is recent and none was asked for"; fi
      # 0115: the vPIC standalone database (public domain, a SQL Server backup) restored in a container and exported by
      # scripts/catalog/vpic-export.sql; any failure leaves the source out of this run (the annotations say why)
      - name: vPIC database export
        if: steps.due.outputs.mode != 'skip' && contains(steps.due.outputs.extra, 'vpicdb')
        continue-on-error: true
        run: |
          set -euo pipefail
          link=$(curl -fsSL https://vpic.nhtsa.dot.gov/api/ | grep -oE 'vPICList_lite_[0-9_]+\.bak\.zip' | sort -u | tail -n 1)
          [ -n "$link" ] || { echo "::warning title=vpicdb::no vPICList_lite backup link on vpic.nhtsa.dot.gov/api"; exit 1; }
          mkdir -p "$RUNNER_TEMP/vpic" && curl -fsSL -o "$RUNNER_TEMP/vpic/db.zip" "https://vpic.nhtsa.dot.gov/api/$link"
          (cd "$RUNNER_TEMP/vpic" && unzip -o -q db.zip && mv ./*.bak db.bak && chmod 644 db.bak)
          PW="Vp$(openssl rand -hex 12)!"; echo "::add-mask::$PW"
          docker run -d --name vpic -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$PW" -v "$RUNNER_TEMP/vpic:/b" mcr.microsoft.com/mssql/server:2022-latest >/dev/null
          for i in $(seq 1 60); do docker exec vpic /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" -Q 'select 1' >/dev/null 2>&1 && break; sleep 5; done
          files=$(docker exec vpic /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" -h -1 -W -Q "SET NOCOUNT ON; RESTORE FILELISTONLY FROM DISK='/b/db.bak'" | awk 'NF {print $1}')
          moves=$(for f in $files; do printf "MOVE '%s' TO '/var/opt/mssql/data/%s', " "$f" "$f"; done)
          docker exec vpic /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" -Q "RESTORE DATABASE vPICList_Lite1 FROM DISK='/b/db.bak' WITH ${moves} REPLACE" >/dev/null
          docker cp scripts/catalog/vpic-export.sql vpic:/b/q.sql
          docker exec vpic /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PW" -d vPICList_Lite1 -i /b/q.sql -s $'\t' -W -o /b/export.tsv
          cp "$RUNNER_TEMP/vpic/export.tsv" "$RUNNER_TEMP/vpic-export.tsv"
          echo "::notice title=vpicdb::$link: $(wc -l < "$RUNNER_TEMP/vpic-export.tsv") rows"
          docker rm -f vpic >/dev/null
      - name: Further source flags
        id: extra
        if: steps.due.outputs.mode != 'skip'
        run: |
          f=''
          case ",${{ steps.due.outputs.extra }}," in *,vpicdb,*) [ -s "$RUNNER_TEMP/vpic-export.tsv" ] && f="$f --vpic-export $RUNNER_TEMP/vpic-export.tsv" ;; esac
          case ",${{ steps.due.outputs.extra }}," in *,nrcan,*) f="$f --nrcan download" ;; esac
          case ",${{ steps.due.outputs.extra }}," in *,wikidata,*) f="$f --wikidata download" ;; esac
          echo "flags=$f" >> "$GITHUB_OUTPUT"
      - name: Dry run (download, normalise, counts, fixture)
        if: steps.due.outputs.mode == 'dry'
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/catalog/import.mjs --vpic --nhtsa ${{ steps.extra.outputs.flags }} --stats "$RUNNER_TEMP/stats.json" --fixture-out "$RUNNER_TEMP/fixture" | tee "$RUNNER_TEMP/out.txt"
          echo "::notice title=catalog stats::$(jq -c 'del(.unmatched, .coverage)' "$RUNNER_TEMP/stats.json")"
          echo "::notice title=catalog coverage::$(jq -c '.coverage' "$RUNNER_TEMP/stats.json" | head -c 3900)"
          echo "::notice title=catalog unmatched::$(jq -r '.unmatched | join(", ")' "$RUNNER_TEMP/stats.json" | head -c 3500)"
      # GitHub keeps at most 10 notices per step: the fixture parts get a step of their own
      - name: Fixture parts
        if: steps.due.outputs.mode == 'dry'
        run: |
          set -euo pipefail
          # the fixture subset, readable through the annotations API (gzip, base64, in parts)
          tar -C "$RUNNER_TEMP/fixture" -czf "$RUNNER_TEMP/fixture.tgz" .
          base64 -w0 "$RUNNER_TEMP/fixture.tgz" > "$RUNNER_TEMP/fixture.b64"
          n=$(( ($(wc -c < "$RUNNER_TEMP/fixture.b64") + 3899) / 3900 ))
          echo "::notice title=catalog fixture::$n parts, $(wc -c < "$RUNNER_TEMP/fixture.tgz") bytes"
          for i in $(seq 0 $((n - 1))); do echo "::notice title=fixture part $i of $n::$(dd if="$RUNNER_TEMP/fixture.b64" bs=3900 skip=$i count=1 2>/dev/null)"; done
      - name: Canadian specifications (vPIC) sample
        if: steps.due.outputs.mode == 'dry'
        continue-on-error: true
        run: |
          r=$(curl -sS --max-time 60 'https://vpic.nhtsa.dot.gov/api/vehicles/GetCanadianVehicleSpecifications/?Year=2020&Make=Volkswagen&Model=&units=Metric&format=json')
          echo "::notice title=cvs::$(echo "$r" | jq -c '{count: .Count, models: [.Results[].Specs[] | select(.Name == "Model") | .Value] | unique, names: [.Results[0].Specs[]? | .Name], first: .Results[0]}' | head -c 3800)"
      # the database driver for the COPY path (0106)
      - name: Install
        if: steps.due.outputs.mode == 'write'
        run: npm ci --no-audit --no-fund
      # 0106: gentle on the database. Staged (COPY over the pooler when the database password is available, else through
      # the Management API), merged 2,000 rows a transaction with a pause and a busy check before each, the trims a
      # make a transaction, the catalog-wide refreshes once at the end. The website keeps the database meanwhile.
      - name: Import (production)
        if: steps.due.outputs.mode == 'write'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # the session pooler (hosted, with the database password) or the SSH tunnel (DB_BACKEND=vps); empty: the Management API
          DATABASE_URL=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" db-url || true)
          if [ -n "$DATABASE_URL" ]; then export DATABASE_URL; else unset DATABASE_URL; fi
          SQL_API_URL=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" sql-api-url); export SQL_API_URL
          node --experimental-strip-types --no-warnings scripts/catalog/import.mjs --vpic --nhtsa ${{ steps.extra.outputs.flags }} --write --stats "$RUNNER_TEMP/stats.json" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" | tee "$RUNNER_TEMP/write.txt"
          echo "::notice title=catalog::$(jq -c 'del(.unmatched, .coverage)' "$RUNNER_TEMP/stats.json")"
          grep -E '^(write|staged|merged|written):' "$RUNNER_TEMP/write.txt" | sed 's/^/::notice title=catalog write::/' || true
      # then the warm-up of the top pages (home, the fleet, each car page: the Worker's post-deploy warm-up, 0102), a
      # little over a minute after the rebuild so every data centre sees the rebuild first (0106)
      - name: Rebuild and warm the public pages
        if: steps.due.outputs.mode == 'write'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          L=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" vault deploy_link_signing_key)
          echo "::add-mask::$L"
          T=$(printf '%s' 'carmacars-listing-worker-v1' | openssl dgst -sha256 -hmac "$L" | sed 's/^.* //')
          echo "::add-mask::$T"
          echo "::notice title=catalog::pages rebuilt: $(curl -sS -X POST https://carmacars.ca/api/jobs/public-rebuild -H "Authorization: Bearer $T" -H 'content-type: application/json' -d '{}' | head -c 200)"
          sleep 75
          echo "::notice title=catalog::warm-up: $(curl -sS -X POST https://carmacars.ca/api/jobs/warm-up -H "Authorization: Bearer $T" | head -c 200)"

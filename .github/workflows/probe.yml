name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - run: |
          set +e
          sudo apt-get -qq install -y libxml2-utils >/dev/null 2>&1
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' --data "$(jq -n --arg q "$1" '{query:$q}')"; }
          rows=$(q "select name, decrypted_secret v from vault.decrypted_secrets where name in ('deploy_gsc_client_id','deploy_gsc_client_secret','deploy_gsc_refresh_token')")
          get() { jq -r --arg n "$1" '[.[]|select(.name==$n)][0].v // empty' <<<"$rows"; }
          AT=$(curl -sS https://oauth2.googleapis.com/token -d client_id="$(get deploy_gsc_client_id)" -d client_secret="$(get deploy_gsc_client_secret)" -d refresh_token="$(get deploy_gsc_refresh_token)" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          ES=$(jq -rn '"sc-domain:carmacars.ca"|@uri')
          for p in https://carmacars.ca/sitemap.xml https://carmacars.ca/sitemap-index/2.xml; do curl -sS -H "Authorization: Bearer $AT" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps/$(jq -rn --arg u "$p" '$u|@uri')" | jq -c '{path,lastSubmitted,lastDownloaded,isPending,isSitemapsIndex,errors,warnings,contents}' >> out.txt; done
          G="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          curl -s -A "$G" https://carmacars.ca/sitemap.xml -o idx.xml; xmllint --noout idx.xml 2>&1 | head -3 >> out.txt; head -c 600 idx.xml >> out.txt; echo >> out.txt
          for u in $(grep -o '<loc>[^<]*</loc>' idx.xml | sed 's/<[^>]*>//g' | sed -n '1p;3p;7p;200p;1000p;20000p;45000p'); do curl -s -A "$G" "$u" -o c.xml -D h; n=$(grep -o '<url>' c.xml | wc -l); v=$(xmllint --noout c.xml 2>&1 | head -1); ct=$(grep -i '^content-type' h | tr -d '\r'); echo "$u urls=$n $ct xml=${v:-ok} first=$(grep -o '<loc>[^<]*</loc>' c.xml | head -1)" >> out.txt; done
          echo "::notice title=probe::$(tr '\n' '|' < out.txt | head -c 6000)"

name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          G="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          seq 100 129 | xargs -P 30 -I{} curl -s -A "$G" -o /dev/null -m 60 -w "{} %{http_code} %{time_total}\n" "https://carmacars.ca/sitemap-index/{}.xml" | sort -n > out.txt
          echo "::notice title=parallel 30::$(awk '{c[$2]++; if($3>m)m=$3} END{for(k in c) printf "%s:%d ",k,c[k]; printf "max %.1fs", m}' out.txt)"
          seq 200 209 | xargs -P 10 -I{} curl -s -A "$G" -o /dev/null -m 60 -w "{} %{http_code} %{time_total}\n" "https://carmacars.ca/sitemap-index/{}.xml" > o2.txt
          echo "::notice title=parallel 10::$(awk '{c[$2]++; if($3>m)m=$3} END{for(k in c) printf "%s:%d ",k,c[k]; printf "max %.1fs", m}' o2.txt)"

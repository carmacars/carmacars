name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - run: |
          set +e
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' --data "$(jq -n --arg q "$1" '{query:$q}')"; }
          rows=$(q "select name, decrypted_secret v from vault.decrypted_secrets where name in ('deploy_gsc_client_id','deploy_gsc_client_secret','deploy_gsc_refresh_token')")
          get() { jq -r --arg n "$1" '[.[]|select(.name==$n)][0].v // empty' <<<"$rows"; }
          AT=$(curl -sS https://oauth2.googleapis.com/token -d client_id="$(get deploy_gsc_client_id)" -d client_secret="$(get deploy_gsc_client_secret)" -d refresh_token="$(get deploy_gsc_refresh_token)" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          ES=$(jq -rn '"sc-domain:carmacars.ca"|@uri')
          for idx in https://carmacars.ca/sitemap.xml https://carmacars.ca/sitemap-index/2.xml; do
            curl -sS -H "Authorization: Bearer $AT" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps?sitemapIndex=$(jq -rn --arg u "$idx" '$u|@uri')" > l.json
            echo "INDEX $idx children=$(jq '.sitemap|length' l.json) downloaded=$(jq '[.sitemap[]?|select(.lastDownloaded)]|length' l.json) errors=$(jq '[.sitemap[]?|select((.errors|tonumber)>0)]|length' l.json) pending=$(jq '[.sitemap[]?|select(.isPending)]|length' l.json) submittedSum=$(jq '[.sitemap[]?.contents[]?.submitted|tonumber]|add' l.json)" >> out.txt
            jq -c '[.sitemap[]? | select(.lastDownloaded) | {p:(.path|sub("https://carmacars.ca";"")), e:.errors, w:.warnings, s:(.contents[0].submitted)}][0:8]' l.json >> out.txt
            jq -c '[.sitemap[]? | select((.errors|tonumber)>0) | (.path|sub("https://carmacars.ca";""))][0:6]' l.json >> out.txt
          done
          G="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for u in /sitemap-places/rental.car-rental.7.xml /sitemap-places/detailing.ppf.3.xml /sitemap-vehicles/tiers-911.xml /sitemap-vehicles/honda-trims.xml; do curl -s -A "$G" -o /dev/null -m 120 -w "$u %{http_code} %{time_total}s %{size_download}B\n" "https://carmacars.ca$u" >> out.txt; done
          echo "::notice title=probe::$(tr '\n' '|' < out.txt | head -c 7000)"

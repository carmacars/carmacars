name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          G="Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for i in 1 2 3; do for n in 300 301; do curl -s -A "$G" -D h -o /dev/null -m 60 -w "$n %{http_code} %{time_total}s " "https://carmacars.ca/sitemap-index/$n.xml" >> o.txt; grep -i '^x-edge\|^cf-cache\|^cache-control\|^cf-ray' h | tr -d '\r' | tr '\n' ' ' >> o.txt; echo >> o.txt; done; sleep 20; done
          b=$(curl -s -m 30 https://carmacars.ca/sign-in); echo "google mentions: $(grep -o -i 'google' <<<"$b" | wc -l), oauth link: $(grep -c '/auth/oauth' <<<"$b")" >> o.txt
          echo "::notice title=probe::$(tr '\n' '|' < o.txt)"

name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          K: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set +e
          umask 077; printf '%s\n' "$K" > k; echo "key lines: $(wc -l < k) first: $(head -1 k | cut -c1-36)" >> out.txt
          ssh-keygen -y -f k > pub 2>err && echo "pub: $(cut -c1-60 pub)" >> out.txt || echo "keygen err: $(cat err)" >> out.txt
          for u in ubuntu root; do r=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i k $u@54.39.111.152 "echo ok \$(whoami)" 2>e); echo "$u exit $? out=$r err=$(tail -1 e | tr -d "|")" >> out.txt; done
          echo "::notice title=probe::$(tr '\n' '|' < out.txt)"

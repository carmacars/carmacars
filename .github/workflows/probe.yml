name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: web
        run: |
          set +e
          node --experimental-strip-types --no-warnings scripts/cf-usage.mjs --out u.json > u.txt 2>&1
          echo "::notice title=usage text::$(tr '\n' '|' < u.txt | head -c 3000)"
          echo "::notice title=days::$(jq -c '[.days[]? | {d:.day, cpu:(.workers_cpu // .cpu_ms // null), req:(.workers_requests // .requests // null)}]' u.json | head -c 3000)"
          echo "::notice title=keys::$(jq -c '.days[0] // {} | keys' u.json)"
          # CPU by script and by hour today (GraphQL)
          Q='query($a:String!,$s:Time!,$e:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsAdaptive(limit:20,filter:{datetime_geq:$s,datetime_leq:$e},orderBy:[sum_cpuTimeUs_DESC]){sum{requests cpuTimeUs} dimensions{scriptName date}}}}}'
          S=$(date -u -d '-7 days' +%Y-%m-%dT00:00:00Z); E=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sS https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data "$(jq -n --arg q "$Q" --arg a "$CLOUDFLARE_ACCOUNT_ID" --arg s "$S" --arg e "$E" '{query:$q,variables:{a:$a,s:$s,e:$e}}')" > g.json
          echo "::notice title=by day::$(jq -c '[.data.viewer.accounts[0].workersInvocationsAdaptive[]? | {d:.dimensions.date, s:.dimensions.scriptName, req:.sum.requests, cpu_ms:((.sum.cpuTimeUs/1000)|floor)}]' g.json | head -c 3500) $(jq -c '.errors' g.json | head -c 500)"

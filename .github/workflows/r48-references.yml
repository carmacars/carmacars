name: r48-references

# Release 47 (2900): the angle guides and the showroom background plates for the generated photo views
# (web/scripts/r48-references.mjs). Run once after the deploy, and again only to remake them. A plate an Admin uploaded
# (Program settings, Showroom background plates) is kept unless replace is true. Production is written only here.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: Also replace plates an Admin uploaded
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: r48-references
  cancel-in-progress: false

env:
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guides and plates (production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          SB="$GITHUB_WORKSPACE/scripts/deploy/sb.sh"
          STORAGE_URL=$("$SB" storage-url); export STORAGE_URL
          SERVICE_KEY=$("$SB" service-key); echo "::add-mask::$SERVICE_KEY"; export SERVICE_KEY
          SQL_API_URL=$("$SB" sql-api-url); if [ -n "$SQL_API_URL" ]; then export SQL_API_URL; else unset SQL_API_URL; fi
          node --experimental-strip-types --no-warnings scripts/r48-references.mjs --write ${{ inputs.replace && '--replace' || '' }} --out "$RUNNER_TEMP/r48"
          echo "::notice title=r48-references::guides and plates written"

name: verify
on:
  workflow_dispatch:
    inputs:
      full: { type: boolean, default: false }
      request: { type: boolean, default: false }
      slug: { type: string, default: '' }
jobs:
  live:
    runs-on: ubuntu-24.04
    steps:
      - name: Home page as Safari on iPhone
        run: |
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for p in / /cars; do
            curl -s -D /tmp/h.txt -A "$UA" "https://carmacars.ca$p" -o /tmp/p.html
            echo "::notice title=page $p::$(grep -iE '^(cache-control|x-edge-cache|x-opennext-cache|age|content-type|x-schema|cf-cache-status)' /tmp/h.txt | tr -d '\r' | paste -sd ';' -) bytes=$(wc -c </tmp/p.html)"
            echo "::notice title=links $p::$(grep -oE '<link[^>]+(stylesheet|\.css)[^>]*>' /tmp/p.html | head -5 | paste -sd ' ' -)"
            echo "::notice title=styles $p::inline style tags $(grep -o '<style' /tmp/p.html | wc -l)"
            for c in $(grep -oE '/_next/static/[^"]+\.css' /tmp/p.html | sort -u); do
              echo "::notice title=css $p::$c $(curl -s -o /dev/null -A "$UA" -w '%{http_code} %{content_type} %{size_download}' https://carmacars.ca$c)"
            done
            head -c 1500 /tmp/p.html; echo
          done

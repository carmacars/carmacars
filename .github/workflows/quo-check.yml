name: quo-check

# The Quo phone line (migration 0085): checks that the repository secret QUO_API_KEY (the CarmaCars workspace's key)
# works and lists the workspace's phone numbers (name and number only) and its webhooks (address, status, events).
# Read only: it changes nothing in Quo. Logs are public: the key is a masked secret and is never printed.
# r48 CM: the comms job (read only too): the database's send logs of email, texts, calls and phone alerts
# (scripts/diag/comms.sql), and Twilio, Amazon SES, Quo and the Worker's secret names as the providers see them
# (scripts/diag/comms-providers.mjs: GET requests only, no key printed).
on:
  workflow_dispatch:

env:
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The key, the phone numbers and the webhooks
        env:
          QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
        run: |
          if [ -z "$QUO_API_KEY" ]; then echo "::error::The repository secret QUO_API_KEY is not set"; exit 1; fi
          node --experimental-strip-types --no-warnings scripts/deploy/quo.mjs check | tee /tmp/quo.txt
          echo "::notice title=quo::$(head -n 1 /tmp/quo.txt)"

  comms:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The providers (read only)
        continue-on-error: true
        env:
          QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
          TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
          AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ vars.AWS_SES_REGION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/diag/comms-providers.mjs
      - name: The send logs (read only)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          scripts/deploy/sb.sh sql-file scripts/diag/comms.sql > "$RUNNER_TEMP/comms.json"
          jq -r '.[0].d | to_entries[] | "\(.key): \(.value | tostring)"' "$RUNNER_TEMP/comms.json" | cut -c1-3000
      - name: The server's function secrets (names only)
        continue-on-error: true
        run: |
          source scripts/deploy/vps.sh
          vps_ssh "sudo grep -oE '^[A-Z_]+=' /opt/carmacars/supabase/functions.env | tr -d = | grep -E 'SES|RESEND|TWILIO|QUO|OUTBOX' | sort | tr '\\n' ' '" < /dev/null

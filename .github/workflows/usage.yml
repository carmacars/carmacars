name: usage

# The usage guard (migration 0080, docs/changes/2026-10-21-usage-guard-and-assistant.md): every hour, Cloudflare's
# figures for the month so far (Worker requests and CPU time, Workers AI neurons, R2 storage; web/scripts/cf-usage.mjs)
# go to the database (app.usage_record_external), which works out each service's state and sends the 80% and 100%
# alerts. Free while the repository is public. The Cloudflare token needs "Account Analytics: Read"; a part it cannot
# read is shown as a notice and skipped.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare figures, month to date
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/cf-usage.mjs --out "$RUNNER_TEMP/usage.json" | tee "$RUNNER_TEMP/usage.txt"
      - name: Into the database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          F="$RUNNER_TEMP/usage.json"
          jq -r '.unavailable | to_entries[] | "\(.key): \(.value)"' "$F" | sed 's/^/::notice title=not readable::/'
          if [ "$(jq '.days | length' "$F")" = 0 ]; then echo "::notice title=usage::no Cloudflare figures this hour"; exit 0; fi
          Q=$(jq -c '{source: "cloudflare", days: .days}' "$F" | sed "s/'/''/g")
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
            --data "$(jq -n --arg q "select app.usage_record_external('$Q'::jsonb) -> 'refresh' -> 'states' as states" '{query: $q}')" > "$RUNNER_TEMP/states.json"
          jq -r '.[0].states | to_entries | map("\(.key) \(.value)") | join(", ")' "$RUNNER_TEMP/states.json" | sed 's/^/::notice title=usage::/'

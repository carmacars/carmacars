name: usage

# The usage guard (migration 0080, docs/changes/2026-10-21-usage-guard-and-assistant.md): every hour, Cloudflare's
# figures for the month so far (Worker requests and CPU time, Workers AI neurons, R2 storage; web/scripts/cf-usage.mjs)
# go to the database (app.usage_record_external), which works out each service's state and sends the 80% and 100%
# alerts. Free while the repository is public. The Cloudflare token needs "Account Analytics: Read"; a part it cannot
# read is shown as a notice and skipped.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

concurrency:
  group: usage
  cancel-in-progress: false

# Where Supabase is: the hosted project (default) or the company's own server (repository variable DB_BACKEND=vps;
# infra/vps/CUTOVER.md). VPS_SSH_KEY is used only with vps (scripts/deploy/vps.sh).
env:
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cloudflare figures, month to date
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/cf-usage.mjs --out "$RUNNER_TEMP/usage.json" | tee "$RUNNER_TEMP/usage.txt"
      # 2026-11-06 (0531): the day's emails by provider, read only: Cloudflare first, Resend after (their daily budgets are Program settings)
      - name: Emails today by provider
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          cat > "$RUNNER_TEMP/email.sql" <<'SQL'
          select public.server_email_budgets() || jsonb_build_object(
            'queued', (select count(*) from notification_outbox where status in ('queued', 'delayed')),
            'expired_today', (select count(*) from notification_outbox where status = 'skipped' and status_reason like 'expired%' and created_at > now() - interval '1 day'),
            'failed_today', (select count(*) from notification_outbox where status = 'failed' and updated_at > now() - interval '1 day'),
            'cf_ok_at', (select cf_ok_at from email_provider_state), 'cf_failed_at', (select cf_failed_at from email_provider_state),
            'cf_error', (select left(cf_error, 200) from email_provider_state),
            'next_due', (select min(send_after) from notification_outbox where status in ('queued', 'delayed')),
            'held', (select string_agg(r || ' ' || n, '; ') from (select left(coalesce(status_reason, status), 60) r, count(*) n from notification_outbox
                       where status in ('queued', 'delayed') group by 1 order by 2 desc limit 4) x)) as e
          SQL
          "$GITHUB_WORKSPACE/scripts/deploy/sb.sh" sql-file "$RUNNER_TEMP/email.sql" > "$RUNNER_TEMP/email.json"
          jq -r '.[0].e | "Cloudflare \(.cf_used)/\(.cf_budget), Resend \(.resend_used)/\(.resend_budget), waiting \(.queued), expired today \(.expired_today), failed today \(.failed_today); Cloudflare last ok \(.cf_ok_at // "never"), last refusal \(.cf_failed_at // "none") \(.cf_error // ""); next due \(.next_due // "none"); held: \(.held // "none")"' "$RUNNER_TEMP/email.json" | sed 's/^/::notice title=emails::/'
      - name: Into the database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          F="$RUNNER_TEMP/usage.json"
          jq -r '.unavailable | to_entries[] | "\(.key): \(.value)"' "$F" | sed 's/^/::notice title=not readable::/'
          # R23: which R2 bucket holds the space (the photos, the documents, the server backups)
          jq -r '(.buckets // []) | map("\(.bucket) \((.bytes / 1073741824 * 100 | round) / 100) GB") | join(", ") | select(length > 0)' "$F" | sed 's/^/::notice title=r2 buckets::/'
          if [ "$(jq '.days | length' "$F")" = 0 ]; then echo "::notice title=usage::no Cloudflare figures this hour"; exit 0; fi
          Q=$(jq -c '{source: "cloudflare", days: .days}' "$F" | sed "s/'/''/g")
          printf "select app.usage_record_external('%s'::jsonb) -> 'refresh' -> 'states' as states" "$Q" > "$RUNNER_TEMP/usage.sql"
          "$GITHUB_WORKSPACE/scripts/deploy/sb.sh" sql-file "$RUNNER_TEMP/usage.sql" > "$RUNNER_TEMP/states.json"
          jq -r '.[0].states | to_entries | map("\(.key) \(.value)") | join(", ")' "$RUNNER_TEMP/states.json" | sed 's/^/::notice title=usage::/'

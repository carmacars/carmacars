name: seo-i18n

# The language versions of the search pages (release 36, part 2; migration 2004; docs/changes/2026-11-11-r36-seo-growth.md):
# stores the template strings of web/src/features/i18n/catalog.ts as data (seo_string_sources) and machine-translates
# the missing ones once with Workers AI (m2m100, within the free daily allowance: max strings a run), loading them into
# seo_strings through the database path the other workflows use (scripts/deploy/sb.sh). A language's pages are indexed
# only once enough of its strings are translated (Program settings seo_i18n_min_coverage_bps). Weekly, on a catalog
# change, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'web/src/features/i18n/catalog.ts'
  workflow_dispatch:
    inputs:
      max:
        description: Most strings to translate this run
        type: string
        default: '800'
  schedule:
    - cron: '23 5 * * 3'

permissions:
  contents: read

concurrency:
  group: seo-i18n
  cancel-in-progress: false

env:
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  translate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sources, translations, load
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAX: ${{ inputs.max || '800' }}
        run: |
          set -euo pipefail
          sb="$GITHUB_WORKSPACE/scripts/deploy/sb.sh"
          load() { tag="j$(openssl rand -hex 6)"; { printf 'select app.server_i18n_load($%s$' "$tag"; cat "$1"; printf '$%s$::jsonb) r' "$tag"; } > "$RUNNER_TEMP/load.sql"; "$sb" sql-file "$RUNNER_TEMP/load.sql"; }
          node --experimental-strip-types --no-warnings web/scripts/seo-i18n.mjs sources > "$RUNNER_TEMP/sources.json"
          load "$RUNNER_TEMP/sources.json" | jq '.[0].r.missing' > "$RUNNER_TEMP/missing.json"
          echo "::notice title=seo-i18n::$(jq length "$RUNNER_TEMP/missing.json") strings to translate"
          MISSING="$RUNNER_TEMP/missing.json" node --experimental-strip-types --no-warnings web/scripts/seo-i18n.mjs translate > "$RUNNER_TEMP/strings.json"
          load "$RUNNER_TEMP/strings.json" >/dev/null

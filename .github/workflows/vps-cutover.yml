name: vps-cutover

# The cutover to the company's own Supabase server, one switch per run, in the order of infra/vps/CUTOVER.md:
#   status           read only: the hosted project's freeze and jobs, the server's live flag and jobs
#   freeze-hosted    the hosted project stops taking writes (jobs paused, read-only by default)   [writes the hosted project]
#   final-copy       the full copy again, now of the frozen project; counts must match exactly
#   go-live          the server's jobs resume and it is marked live (the copy refuses from then on); then
#                    infra/vps/backend becomes vps (committed to main by this workflow) and ci deploys the site
#                    (checks off: the commit on main already passed them) unless deploy is off
#   unfreeze-hosted  abort before go-live: the hosted project takes writes again, its jobs resume [writes the hosted project]
#   rollback         after go-live: the server's jobs paused, not live, the hosted project unfrozen; then
#                    infra/vps/backend back to supabase and the site deployed again (unless deploy is off)
# Every switch but status needs the confirmation text CUTOVER. A repository variable DB_BACKEND, if one is ever set,
# wins over infra/vps/backend: keep it unset.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Which switch
        type: choice
        options: [status, freeze-hosted, final-copy, go-live, unfreeze-hosted, rollback]
        default: status
      confirm:
        description: Type CUTOVER to run anything but status
        type: string
        default: ''
      skip_buckets:
        description: final-copy only - Storage buckets not copied
        type: string
        default: backups
      deploy:
        description: go-live and rollback - commit infra/vps/backend and deploy the site (ci, production, checks off)
        type: boolean
        default: true

permissions:
  contents: write   # go-live and rollback commit infra/vps/backend to main
  actions: write    # ...and start the ci deploy

concurrency:
  group: vps-ops
  cancel-in-progress: false

# a failed step's last lines become error annotations (readable without the logs: gh run view, the API)
defaults:
  run:
    shell: bash .github/ci-run.sh vps-cutover bash --noprofile --norc -eo pipefail {0}

jobs:
  cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ACTION: ${{ inputs.action }}
      CONFIRM: ${{ inputs.confirm }}
      SKIP_BUCKETS: ${{ inputs.skip_buckets }}
      APP_URL: https://carmacars.ca
    steps:
      - name: Confirmation
        shell: bash
        run: |
          if [ "$ACTION" != status ] && [ "$CONFIRM" != CUTOVER ]; then echo "::error::type CUTOVER in confirm to run $ACTION"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgreSQL 17 client
        if: inputs.action == 'final-copy'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -q postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: supabase/setup-cli@v1
        if: inputs.action == 'final-copy'
        with:
          version: latest
      - name: Final copy (the hosted project must be frozen)
        if: inputs.action == 'final-copy'
        env:
          COPY_MODE: final
        run: |
          infra/vps/scripts/cutover.sh status
          infra/vps/scripts/cutover.sh assert-frozen
          t0=$(date +%s)
          COPY_DIR="$RUNNER_TEMP/copy" infra/vps/scripts/copy.sh preflight dump reset restore vault cron auth functions storage verify basebackup
          echo "::notice title=cutover::final copy done in $(( ($(date +%s) - t0) / 60 )) min. Next: go-live."
      - name: Remove the dump from the runner
        if: always() && inputs.action == 'final-copy'
        run: rm -rf "$RUNNER_TEMP/copy"
      - name: Switch
        if: inputs.action != 'final-copy'
        run: infra/vps/scripts/cutover.sh "$ACTION"
      - name: infra/vps/backend and the site's deploy
        if: (inputs.action == 'go-live' || inputs.action == 'rollback') && inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=vps; [ "$ACTION" = rollback ] && want=supabase
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pushed=no
          for _ in 1 2 3; do
            git fetch -q origin main && git checkout -q -B main origin/main
            awk -v w="$want" 'BEGIN{done=0} /^[[:space:]]*#/ || /^[[:space:]]*$/ {print; next} !done {print w; done=1; next} {print}' infra/vps/backend > infra/vps/backend.new
            grep -qx "$want" infra/vps/backend.new || echo "$want" >> infra/vps/backend.new
            mv infra/vps/backend.new infra/vps/backend
            if git diff --quiet -- infra/vps/backend; then echo "infra/vps/backend is already $want"; pushed=yes; break; fi
            git add infra/vps/backend
            git commit -q -m "Supabase backend: $want (vps-cutover $ACTION, run $GITHUB_RUN_ID)"
            if git push -q origin main; then pushed=yes; break; fi
            sleep 5
          done
          [ "$pushed" = yes ] || { echo "::error::could not push infra/vps/backend=$want to main: set it by hand and run ci with deploy"; exit 1; }
          echo "::notice title=cutover::infra/vps/backend = $want on main ($(git rev-parse --short HEAD))"
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref main -f deploy=true -f checks=false -f environment=production
          sleep 8
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -L 1 --json databaseId,url --jq '.[0].url')
          echo "::notice title=cutover::site deploy started: $run (about 15 minutes; then the smoke tests of CUTOVER.md)"

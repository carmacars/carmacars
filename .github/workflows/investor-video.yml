name: investor-video

# The investor deck's narrated video (docs/investor-video/script.md; web/scripts/investor-video). The owner, October 23,
# 2026: a video that goes over the entire deck, right above the deck on the investor page, in addition to it.
#
# render: the deck's figures (app.deck_figures(), read only) -> the plan (build.mjs: the deck rendered with those
# figures, the script filled from them and checked against the deck) -> the voice (tts.mjs: Cloudflare Workers AI) ->
# (Kokoro-82M open weights in a job with no secrets when the Cloudflare token may not use Workers AI) -> the
# timeline and captions -> every frame in Chromium (render.mjs) -> the sound (audio.mjs: voice, a synthesized pad
# ducked under it, synthesized whooshes) -> 1080p and 720p MP4, poster, WebVTT -> checks (frames on a contact sheet,
# loudness, sizes) -> uploaded to the PRIVATE Supabase Storage bucket investor-media/deck-video (the deck has no public
# version; the deck page signs short-lived links for each visit). Writes nothing to the database.
# checks: typecheck, lint, unit tests and the investor deck's end to end test (one worker) on the local stack.
#
# Runs on a push to the investorvideo branch, by hand, and on the 1st of each month (once on the default branch), so
# the video's dates and figures follow the deck's.
on:
  push:
    branches: [investorvideo]
    paths:
      - '.github/workflows/investor-video.yml'
      - 'docs/investor-video/**'
      - 'web/scripts/investor-video/**'
      - 'web/src/features/deck/**'
      - 'web/src/styles/deck.css'
      - 'web/src/app/investor/deck/**'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the video to Storage (off: render and check only)'
        type: boolean
        default: true
      checks:
        description: Also run typecheck, lint, unit and the investor deck end to end test
        type: boolean
        default: true
  schedule:
    - cron: '17 9 1 * *'

concurrency:
  group: investor-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CARMACARS_LOCAL_DIR: /tmp/cc-local

jobs:
  # the figures, the plan, and the voice from Cloudflare Workers AI when the token may use it
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      voiced: ${{ steps.tts.outputs.voiced }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_BACKEND: ${{ vars.DB_BACKEND || 'supabase' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      OUT: ${{ github.workspace }}/web/.video
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: ffmpeg (Ubuntu's package)
        timeout-minutes: 10
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -q -o Acquire::Retries=3 && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ffmpeg; }
      - name: The deck's figures (app.deck_figures(), read only)
        run: |
          source ../scripts/deploy/lib.sh
          mkdir -p "$OUT"
          sbq "select app.deck_figures() as f" > "$OUT/figures.json"
          jq -e '.[0].f.investment.min_cents and .[0].f.settings.deck_return_bps' "$OUT/figures.json" > /dev/null || die "app.deck_figures() did not answer"
      - name: Plan (the deck rendered with those figures; the script filled and checked against it)
        run: node scripts/investor-video/build.mjs --figures "$OUT/figures.json" --today "$(TZ=America/Toronto date +%F)" --out "$OUT"
      - name: Voice (Cloudflare Workers AI text to speech)
        id: tts
        timeout-minutes: 15
        run: |
          if node scripts/investor-video/tts.mjs --dir "$OUT"; then echo "voiced=true" >> "$GITHUB_OUTPUT"
          else echo "::warning title=tts::Cloudflare Workers AI did not speak (the token needs Workers AI permission); the open Kokoro voice is used instead"; rm -rf "$OUT/voice"; echo "voiced=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: investor-video-plan
          retention-days: 1
          include-hidden-files: true
          path: |
            web/.video/plan.json
            web/.video/stage.html
            web/.video/voice

  # the voice from open weights (Kokoro-82M, Apache 2.0) on the runner's CPU, in a job with no secrets
  voice:
    needs: plan
    if: needs.plan.outputs.voiced != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: investor-video-plan
          path: web/.video
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kokoro and ffmpeg
        timeout-minutes: 15
        run: |
          sudo apt-get update -q -o Acquire::Retries=3 && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends espeak-ng ffmpeg
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q 'kokoro>=0.9.4' soundfile
      - name: Voice (Kokoro-82M)
        timeout-minutes: 15
        run: python scripts/investor-video/tts_local.py --dir .video --voice "${TTS_VOICE:-af_heart}"
      - uses: actions/upload-artifact@v4
        with:
          name: investor-video-voice
          retention-days: 1
          include-hidden-files: true
          path: web/.video/voice

  render:
    needs: [plan, voice]
    if: always() && needs.plan.result == 'success' && (needs.voice.result == 'success' || needs.voice.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DB_BACKEND: ${{ vars.DB_BACKEND || 'supabase' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      OUT: ${{ github.workspace }}/web/.video
      BUCKET: investor-media
      FOLDER: deck-video
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: investor-video-plan
          path: web/.video
      - uses: actions/download-artifact@v4
        if: needs.voice.result == 'success'
        with:
          name: investor-video-voice
          path: web/.video/voice
      - name: Playwright browser cache
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: ffmpeg (Ubuntu's package, before the browser's libraries)
        timeout-minutes: 10
        run: |
          command -v ffmpeg > /dev/null || { sudo apt-get update -q -o Acquire::Retries=3 && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ffmpeg; }
          ffmpeg -hide_banner -version | head -1
      - name: Chromium
        timeout-minutes: 15
        run: if [ "${{ steps.pw.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Timeline and captions
        run: node scripts/investor-video/timeline.mjs --dir "$OUT"
      - name: Frames (1920x1080, 30 fps)
        timeout-minutes: 45
        run: node scripts/investor-video/render.mjs --dir "$OUT" --workers 3
      - name: Sound (voice, pad ducked under it, whooshes)
        run: node scripts/investor-video/audio.mjs --dir "$OUT"
      - name: MP4 1080p and 720p, poster, captions
        run: |
          D="$OUT/final"; mkdir -p "$D"
          ffmpeg -hide_banner -loglevel error -y -i "$OUT/video.mp4" -i "$OUT/mix.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 160k -ar 48000 -shortest -movflags +faststart \
            -metadata title="CarmaCars investor deck" "$D/carmacars-investor-1080p.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$D/carmacars-investor-1080p.mp4" -vf scale=1280:720:flags=lanczos -c:v libx264 -preset slow -crf 21 -maxrate 4M -bufsize 8M \
            -pix_fmt yuv420p -profile:v high -c:a copy -movflags +faststart "$D/carmacars-investor-720p.mp4"
          # the poster: the title slide once it has settled
          ffmpeg -hide_banner -loglevel error -y -ss 3 -i "$OUT/video.mp4" -frames:v 1 -vf scale=1600:-2 -q:v 3 "$D/poster.jpg"
          cp "$OUT/captions.vtt" "$D/captions.vtt"
      - name: Checks (sizes, streams, 12 frames, loudness, waveform)
        run: |
          D="$OUT/final"; Q="$OUT/qa"; mkdir -p "$Q"
          V="$D/carmacars-investor-1080p.mp4"
          dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          frames=$(jq .frames "$OUT/timeline.json")
          # 12 frames across the video, on one contact sheet
          step=$(( frames / 12 ))
          ffmpeg -hide_banner -loglevel error -y -i "$V" -vf "select='eq(mod(n\,$step)\,$(( step / 2 )))',scale=640:360,tile=4x3:padding=8:color=0x333333" -frames:v 1 -q:v 3 "$Q/contact-sheet.jpg"
          ffmpeg -hide_banner -loglevel error -y -i "$V" -filter_complex "showwavespic=s=1920x320:split_channels=0:colors=0xD0111B" -frames:v 1 "$Q/waveform.png"
          ffmpeg -hide_banner -nostats -i "$V" -map 0:a -af ebur128=framelog=quiet -f null - 2> "$Q/ebur128.txt" || true
          ffmpeg -hide_banner -nostats -ss 20 -t 6 -i "$V" -map 0:a -af astats=metadata=0:reset=0,volumedetect -f null - 2> "$Q/astats-20s.txt" || true
          {
            echo "## Investor video"
            echo
            echo "- Duration: ${dur} s; frames $frames; voice: $(jq -r '.model + (if .speaker then " (" + .speaker + ")" else "" end)' "$OUT/voice/durations.json")"
            for f in "$D"/*; do echo "- $(basename "$f"): $(stat -c %s "$f") bytes"; done
            echo "- Streams: $(ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate,sample_rate,channels -of compact=p=0:nk=1 "$V" | paste -sd ' | ')"
            echo "- Loudness: $(grep -E '^\s+I:|^\s+LRA:|Peak:' "$Q/ebur128.txt" | tr -s ' ' | paste -sd ' ')"
            echo "- Audio 20 to 26 s: $(grep -E 'RMS level dB|Peak level dB|mean_volume|max_volume' "$Q/astats-20s.txt" | sed 's/.*\] //' | head -6 | paste -sd '; ')"
            echo "- Scenes: $(jq -r '[.scenes[] | "\(.n) \(.dur|floor)s"] | join(", ")' "$OUT/timeline.json")"
          } | tee -a "$GITHUB_STEP_SUMMARY" | grep '^- ' | sed 's/^- /::notice title=qa::/'
          size=$(stat -c %s "$V")
          [ "$size" -le 50000000 ] || { echo "::error title=investor video::the 1080p file is $size bytes (over 50 MB, the Storage upload limit)"; exit 1; }
          awk -v d="$dur" 'BEGIN { exit !(d > 120 && d < 330) }' || { echo "::error title=investor video::duration $dur s is outside 2 to 5.5 minutes"; exit 1; }
          echo "::notice title=investor video::$(printf '%.0f' "$dur") s, 1080p $(( size / 1048576 )) MB, voice $(jq -r .model "$OUT/voice/durations.json")"
      - name: Keep the outputs for three days
        uses: actions/upload-artifact@v4
        with:
          name: investor-video
          retention-days: 3
          include-hidden-files: true
          path: |
            web/.video/final
            web/.video/qa
            web/.video/plan.json
            web/.video/timeline.json
      - name: Upload to Storage (private bucket investor-media, folder deck-video)
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        run: |
          source ../scripts/deploy/lib.sh
          sb_keys
          ST="$SB_URL/storage/v1"; H=(-H "Authorization: Bearer $SB_SERVICE_KEY" -H "apikey: $SB_SERVICE_KEY")
          code=$(curl -sS -o /tmp/b.json -w '%{http_code}' "${H[@]}" "$ST/bucket/$BUCKET")
          if [ "$code" != 200 ]; then
            curl -sS -f -o /dev/null -X POST "${H[@]}" -H 'content-type: application/json' "$ST/bucket" \
              --data "{\"id\":\"$BUCKET\",\"name\":\"$BUCKET\",\"public\":false,\"allowed_mime_types\":[\"video/mp4\",\"image/jpeg\",\"image/png\",\"text/vtt\",\"application/json\"]}" \
              || die "Could not create the private bucket $BUCKET"
            notice "Storage: private bucket $BUCKET created"
          elif [ "$(jq -r .public /tmp/b.json)" != false ]; then die "The bucket $BUCKET is public; the deck has no public version"; fi
          up() { # file, key, type
            local c; c=$(curl -sS -o /tmp/up.json -w '%{http_code}' -X POST "${H[@]}" -H "content-type: $3" -H 'x-upsert: true' -H 'cache-control: max-age=3600' \
              --data-binary "@$1" "$ST/object/$BUCKET/$FOLDER/$2")
            [ "${c:0:1}" = 2 ] || die "Upload of $2 failed ($c): $(head -c 300 /tmp/up.json)"
            log "uploaded $FOLDER/$2 ($(stat -c %s "$1") bytes)"
          }
          D="$OUT/final"; Q="$OUT/qa"
          up "$D/carmacars-investor-1080p.mp4" carmacars-investor-1080p.mp4 video/mp4
          up "$D/carmacars-investor-720p.mp4" carmacars-investor-720p.mp4 video/mp4
          up "$D/poster.jpg" poster.jpg image/jpeg
          up "$D/captions.vtt" captions.vtt text/vtt
          up "$Q/contact-sheet.jpg" qa/contact-sheet.jpg image/jpeg
          up "$Q/waveform.png" qa/waveform.png image/png
          up "$OUT/timeline.json" qa/timeline.json application/json
          # the page's own path: sign the four files as the deck page does, and fetch each one through its link
          signed=$(curl -sS -X POST "${H[@]}" -H 'content-type: application/json' "$ST/object/sign/$BUCKET" \
            --data "{\"expiresIn\":600,\"paths\":[\"$FOLDER/carmacars-investor-1080p.mp4\",\"$FOLDER/carmacars-investor-720p.mp4\",\"$FOLDER/poster.jpg\",\"$FOLDER/captions.vtt\"]}")
          for u in $(jq -r '.[].signedURL' <<<"$signed"); do
            h=$(curl -sS -o /dev/null -D - -r 0-1023 -H 'Origin: https://carmacars.ca' "$ST$u" | tr -d '\r')
            st=$(head -1 <<<"$h" | awk '{print $2}'); ty=$(grep -i '^content-type:' <<<"$h" | cut -d' ' -f2); acao=$(grep -i '^access-control-allow-origin:' <<<"$h" | cut -d' ' -f2)
            echo "- signed fetch ${u%%\?*}: $st $ty, CORS ${acao:-none}" | sed "s#/object/sign/$BUCKET/##" | tee -a "$GITHUB_STEP_SUMMARY" | sed 's/^- /::notice title=storage::/'
            [[ "$st" =~ ^20[06]$ ]] || die "A signed link did not answer ($st)"
          done
          # the contact sheet, for a look: a link valid 24 hours (stills of the deck only, no file of the video)
          qa=$(curl -sS -X POST "${H[@]}" -H 'content-type: application/json' "$ST/object/sign/$BUCKET/$FOLDER/qa/contact-sheet.jpg" --data '{"expiresIn":86400}' | jq -r .signedURL)
          echo "- Contact sheet (24 h): $SB_PUBLIC_URL/storage/v1$qa" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=contact sheet (24 h)::$SB_PUBLIC_URL/storage/v1$qa"
          notice "Uploaded to $BUCKET/$FOLDER (private)"

  checks:
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then sudo apt-get update -q && sudo apt-get install -y -q postgresql-16 postgresql-client-16; fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - name: Text check
        working-directory: .
        run: scripts/check-text.sh
      - name: The video's plan builds from the sample figures (script and deck agree)
        run: node scripts/investor-video/build.mjs --out /tmp/video-plan
      - name: Playwright browser cache
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Browsers
        run: if [ "${{ steps.pw.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi
      - name: Local stack (migrations, local auth, seed)
        run: |
          cp .env.example .env.local
          bash scripts/local-db.sh up
      - run: npm run build
      - name: Server
        run: |
          (node scripts/serve.mjs > /tmp/serve.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
      - name: The investor deck, end to end (one worker)
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/investor-deck.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: investor-deck-e2e
          retention-days: 3
          path: |
            web/test-results
            /tmp/serve.log

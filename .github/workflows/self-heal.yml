name: self-heal

# Every 15 minutes (GitHub may run it late), without Claude: self-heal that learns (release 28, B6).
# .github/self-heal/heal.mjs probes from outside (the site's health, the server API, email, the certificates, the
# server's own checks, the backup and the scheduled workflows), names each failure by a signature, and decides with
# web/src/lib/self-heal/decide.ts:
#   a signature in the runbook (.github/self-heal/runbook.json, from docs/runbook-outage.md and past incidents) gets its
#     known safe action: wait, vps-ops reboot or apply-retention (at most one vps-ops action in 6 hours, only when the
#     server is the live backend, and a reboot only after about 45 minutes of API failure), re-run a failed scheduled
#     workflow, or start a backup
#   a signature not in the runbook gets the action people named when they closed its issue ("self-heal: <sig> => <action>")
#   anything else, or an action that did not help twice, opens one GitHub issue (label self-heal; outage for the site and
#     the API), closed by itself on recovery
# Every incident's signature, action and outcome go to the ledger (the open issue labelled self-heal-ledger). No SQL runs
# here. What to do otherwise: docs/runbook-outage.md.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write   # dispatch vps-ops (reboot); read the run history

concurrency:
  group: self-heal
  cancel-in-progress: false

defaults:
  run:
    shell: bash .github/ci-run.sh self-heal bash --noprofile --norc -eo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_BACKEND: ${{ vars.DB_BACKEND }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            web/src/lib/self-heal
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe, decide, act, record
        id: check
        run: node --experimental-strip-types --no-warnings .github/self-heal/heal.mjs
      - name: Result
        if: always()
        run: '[ "${{ steps.check.outputs.site }}" = ok ] && [ "${{ steps.check.outputs.api }}" = ok ]'

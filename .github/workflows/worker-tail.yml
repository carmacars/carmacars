name: worker-tail
# TEMPORARY diagnostic (sign-in outage 2026-11-23), never merged.
on:
  workflow_dispatch:
    inputs:
      seconds:
        type: string
        default: '90'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra/vps
            scripts/deploy
      - name: Diagnose
        run: |
          source scripts/deploy/vps.sh
          MASK='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+/[email]/g; s/eyJ[A-Za-z0-9_-]{10,}(\.[A-Za-z0-9_-]+)*/[token]/g; s/\+?[0-9][0-9 ().-]{8,}[0-9]/[number]/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}/[ip]/g'
          q() { echo "=== $1"; vps_sql "$2" | jq -c '.[]' | sed -E "$MASK" || echo "(failed)"; }
          q "sms log 24h" "select date_trunc('hour', created_at) h, status, left(coalesce(reason,''),250) r, count(*) from public.auth_sms_log where created_at > now() - interval '24 hours' group by 1,2,3 order by 1"
          q "sms log last ok" "select max(created_at) from public.auth_sms_log where status='sent'"
          q "outbox delayed reasons" "select status_reason, channel, count(*), min(created_at), max(created_at), min(send_after), max(send_after) from public.notification_outbox where status='delayed' group by 1,2 order by 3 desc limit 20"
          q "outbox sent per hour 24h" "select date_trunc('hour', sent_at) h, channel, count(*) from public.notification_outbox where sent_at > now() - interval '24 hours' group by 1,2 order by 1"
          q "outbox failed 24h" "select code, channel, left(coalesce(status_reason,''),200) r, count(*) from public.notification_outbox where status='failed' and created_at > now() - interval '24 hours' group by 1,2,3 order by 4 desc limit 20"
          q "email cap settings" "select * from app.email_cap_status() limit 5"
          echo "=== auth container log errors (6h)"
          vps_ssh sudo docker logs --since 1h supabase-auth 2>&1 | grep -iE '"level":"(error|warn)"|error' | jq -Rrc 'fromjson? // . | if type=="object" then {t: .time, l: .level, m: (.msg // ""), e: (.error // ""), p: (.path // ""), s: (.status // "")} else . end' | sed -E "$MASK" | tail -60 || true
          echo "=== auth status counts (6h)"
          vps_ssh sudo docker logs --since 6h supabase-auth 2>&1 | jq -Rrc 'fromjson? | select(.path != null) | "\(.method) \(.path) \(.status)"' | sort | uniq -c | sort -rn | head -40 || true
          echo "=== kong 4xx/5xx on auth (6h)"
          vps_ssh sudo docker logs --since 6h supabase-kong 2>&1 | grep -E '/auth/v1' | grep -oE '"(GET|POST|PUT) [^ ?"]+[^"]*" [0-9]{3}' | sed -E 's/\?[^ ]*//' | sort | uniq -c | sort -rn | head -30 || true
          echo "=== site probes"
          for p in / /sign-in /staff /admin /api/health; do curl -sS -o /dev/null -w "$p %{http_code} %{time_total}\n" --max-time 20 "https://carmacars.ca$p" || true; done
          curl -sS --max-time 15 "https://api.carmacars.ca/auth/v1/.well-known/openid-configuration" | jq -c '{issuer}' || true

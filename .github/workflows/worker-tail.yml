name: worker-tail
# TEMPORARY diagnostic (sign-in outage 2026-11-23), never merged.
on:
  workflow_dispatch:
    inputs:
      seconds:
        type: string
        default: '90'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra/vps
            scripts/deploy
      - name: Diagnose
        run: |
          source scripts/deploy/vps.sh
          MASK='s/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+/[email]/g; s/eyJ[A-Za-z0-9_-]{10,}(\.[A-Za-z0-9_-]+)*/[token]/g; s/\+?[0-9][0-9 ().-]{8,}[0-9]/[number]/g; s/([0-9]{1,3}\.){3}[0-9]{1,3}/[ip]/g'
          q() { echo "=== $1"; vps_sql "$2" | jq -c '.[]' | sed -E "$MASK" || echo "(failed)"; }
          q "audit actions by hour (8h)" "select date_trunc('hour', created_at) h, payload->>'action' a, count(*) from auth.audit_log_entries where created_at > now() - interval '8 hours' group by 1,2 order by 1,2"
          q "sign_in_events by hour (24h)" "select date_trunc('hour', at) h, ok, count(*) from public.sign_in_events where at > now() - interval '24 hours' group by 1,2 order by 1,2"
          q "rate limit sign_in keys" "select regexp_replace(key, ':[^:]*$', ':*') k, (key like '%0.0.0.0%') noip, window_start, hits from app.rate_limit_hits where key ilike '%sign%' or key ilike '%otp%' or key ilike '%code%' or key ilike '%login%' order by last_hit_at desc limit 40"
          q "outbox failures 8h" "select code, status, left(coalesce(last_error, ''), 200) e, count(*) from public.notification_outbox where created_at > now() - interval '8 hours' and status in ('failed','delayed','queued','sending') group by 1,2,3 order by 4 desc limit 30"
          q "auth users last sign-in max" "select max(last_sign_in_at) from auth.users"
          q "auth refresh tokens issued per hour" "select date_trunc('hour', created_at) h, count(*) from auth.refresh_tokens where created_at > now() - interval '24 hours' group by 1 order by 1"
          echo "=== auth container log errors (6h)"
          vps_ssh sudo docker logs --since 6h supabase-auth 2>&1 | grep -iE '"level":"(error|warn)"|error' | jq -Rrc 'fromjson? // . | if type=="object" then {t: .time, l: .level, m: (.msg // ""), e: (.error // ""), p: (.path // ""), s: (.status // "")} else . end' | sed -E "$MASK" | tail -60 || true
          echo "=== auth status counts (6h)"
          vps_ssh sudo docker logs --since 6h supabase-auth 2>&1 | jq -Rrc 'fromjson? | select(.path != null) | "\(.method) \(.path) \(.status)"' | sort | uniq -c | sort -rn | head -40 || true
          echo "=== kong 4xx/5xx on auth (6h)"
          vps_ssh sudo docker logs --since 6h supabase-kong 2>&1 | grep -E '/auth/v1' | grep -oE '"(GET|POST|PUT) [^ ?"]+[^"]*" [0-9]{3}' | sed -E 's/\?[^ ]*//' | sort | uniq -c | sort -rn | head -30 || true
          echo "=== site probes"
          for p in / /sign-in /staff /admin /api/health; do curl -sS -o /dev/null -w "$p %{http_code} %{time_total}\n" --max-time 20 "https://carmacars.ca$p" || true; done
          curl -sS --max-time 15 "https://api.carmacars.ca/auth/v1/.well-known/openid-configuration" | jq -c '{issuer}' || true

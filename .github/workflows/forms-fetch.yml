name: forms-fetch

# The official ServiceOntario forms for Admin > Settings > Forms (0042's official form mapping; 0046's default
# drafts). Resolves each dataset page of the Central Forms Repository to its English PDF, downloads it, records its
# SHA-256, its pages and its fillable fields (web/scripts/forms-fetch.mjs; an encrypted form is opened with qpdf, a pure
# XFA form is laid out by pdf.js and printed to a plain PDF with the box of each field, web/scripts/forms-xfa.mjs), then stores each PDF in the private
# documents bucket under forms/templates/<code>/ (where Admin > Settings > Forms keeps uploaded templates) and the
# report in deploy-reports/forms/<run id>/report.json. Nothing in the database changes: the templates and their
# draft mappings are added by a migration from this report, and an Admin checks each one before owners get it.
on:
  workflow_dispatch: {}

concurrency:
  group: forms-fetch
  cancel-in-progress: false

# Where Supabase is: the hosted project (default) or the company's own server (repository variable DB_BACKEND=vps;
# infra/vps/CUTOVER.md). VPS_SSH_KEY is used only with vps (scripts/deploy/vps.sh).
env:
  DB_BACKEND: ${{ vars.DB_BACKEND }}
  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tools (qpdf opens the encrypted forms; Chromium lays out a pure XFA form)
        run: |
          sudo apt-get install -y -qq qpdf > /dev/null
          npx playwright install --with-deps chromium > /dev/null
      - name: Resolve, download and read the forms
        run: |
          node scripts/forms-fetch.mjs --out "$RUNNER_TEMP/forms" | tee "$RUNNER_TEMP/forms.txt"
          sed 's/^/::notice title=forms::/' "$RUNNER_TEMP/forms.txt"
      - name: Store the PDFs (documents bucket) and the report (deploy-reports)
        if: always()
        run: |
          set -euo pipefail
          K=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" service-key)
          echo "::add-mask::$K"
          S=$("$GITHUB_WORKSPACE/scripts/deploy/sb.sh" storage-url)
          curl -sS -o /dev/null -X POST "$S/bucket" -H "Authorization: Bearer $K" -H "apikey: $K" -H 'content-type: application/json' --data '{"id":"deploy-reports","name":"deploy-reports","public":false}' || true
          R="$RUNNER_TEMP/forms/report.json"
          [ -f "$R" ] || { echo "::error title=forms::no report was written"; exit 1; }
          for row in $(jq -r '.forms[] | select(.downloaded) | "\(.code)|\(.sha256)"' "$R"); do
            code="${row%%|*}"; sha="${row##*|}"
            key="forms/templates/$code/official-${sha:0:16}.pdf"
            curl -sS -f -o /dev/null -X POST "$S/object/documents/$key" -H "Authorization: Bearer $K" -H "apikey: $K" -H 'content-type: application/pdf' -H 'x-upsert: true' --data-binary "@$RUNNER_TEMP/forms/$code.pdf"
            curl -sS -f -o /dev/null -X POST "$S/object/deploy-reports/forms/${{ github.run_id }}/$code.original.pdf" -H "Authorization: Bearer $K" -H "apikey: $K" -H 'content-type: application/pdf' -H 'x-upsert: true' --data-binary "@$RUNNER_TEMP/forms/$code.original.pdf"
            curl -sS -f -o /dev/null -X POST "$S/object/deploy-reports/forms/${{ github.run_id }}/$code.pdf" -H "Authorization: Bearer $K" -H "apikey: $K" -H 'content-type: application/pdf' -H 'x-upsert: true' --data-binary "@$RUNNER_TEMP/forms/$code.pdf"
            echo "::notice title=forms::$code stored at documents/$key"
          done
          jq --arg run "${{ github.run_id }}" '.run_id = $run | .forms |= map(if .downloaded then .file_key = "forms/templates/\(.code)/official-\(.sha256[0:16]).pdf" else . end)' "$R" > "$R.tmp" && mv "$R.tmp" "$R"
          curl -sS -f -o /dev/null -X POST "$S/object/deploy-reports/forms/${{ github.run_id }}/report.json" -H "Authorization: Bearer $K" -H "apikey: $K" -H 'content-type: application/json' -H 'x-upsert: true' --data-binary "@$R"
          jq -r '.forms[] | "\(.code): \(if .ok then "\(.kind): \(.pages) pages, \(.fields | length) fields, fillable \(.fillable), pure XFA \(.pure_xfa), \(.file_key)" else "failed: \(.error)" end)"' "$R" | sed 's/^/::notice title=forms report::/'
          echo "::notice title=forms::report at deploy-reports/forms/${{ github.run_id }}/report.json"

name: ci

# The repository is public, so Actions minutes cost nothing; the budget below still keeps runs short (docs/ci-minutes.md).
# No pull_request trigger: a pull request from a fork would run the fork's code here. The only triggers are a push to
# this repository (write access) and Run workflow; secrets are passed only to the deploy job, which runs only on Run
# workflow. Logs are public: no step prints a secret or personal data (secrets are masked; the checks use test data).
#
#   push                 the fast gates only: the database suite (every migration, every test; in parallel slices,
#                        jobs db and db-suite) and, in the job fast, the text check, lint, types, unit tests and the
#                        generated types. Skipped entirely when only documentation changed (docs/**, *.md). A newer
#                        push to the same branch cancels the older run.
#   Run workflow         deploy = true: the fast gates, then the full suite (Worker build, every end-to-end test at
#                        375 and 1440 with axe, link check, copy lint, crawl as every role, SEO, emails with
#                        database values), then the deploy. full = true without deploy: the same checks, no deploy.
#                        checks = false skips both (re-deploy of a commit that already passed).
#
# Deploy needs the five repository secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) and, for the phone line, QUO_API_KEY: everything else is read at deploy time from the Supabase project (its
# keys, and the deploy_* secrets in its vault). See scripts/deploy/ and web/README.md, "Deploy". A failing step puts
# its last output lines into the run's annotations.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'emails/shots/**'
      - 'emails/preview/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply migrations to Supabase and deploy the web app to Cloudflare (runs the full suite first)
        type: boolean
        default: false
      full:
        description: Run the full suite (build, end to end, crawl, SEO, emails) without deploying
        type: boolean
        default: false
      checks:
        description: Run the checks first (turn off only to re-run a deploy of a commit that already passed)
        type: boolean
        default: true
      lighthouse:
        description: Also record Lighthouse mobile scores (a few minutes; not gated)
        type: boolean
        default: false
      e2e_grep:
        description: Only the end-to-end tests whose title matches (diagnosis; leave empty for all)
        type: string
        default: ''
      page_cache:
        description: Page cache (auto; assets when the Cloudflare KV daily write quota is used up)
        type: choice
        options: [auto, assets]
        default: auto
      emergency:
        description: Emergency (r27b) - ship the Worker even when the database steps fail under load (migrations, seed, photos); never with checks
        type: boolean
        default: false
      environment:
        description: Target
        type: choice
        options: [production, staging]
        default: production

# A newer push to the same branch cancels the run it supersedes. A deploy run never cancels (or is cancelled by)
# a push run, and a second deploy waits for the first.
# The workflow's token only reads the repository (a job that needs more says so itself).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CARMACARS_LOCAL_DIR: /tmp/cc-local

jobs:
  # ---------------------------------------------------------------- the fast gates (every push)
  fast:
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-24.04
    # the database suite (35 of this job's 41 minutes in November) runs beside this job, in the db jobs below
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: PostgreSQL 16 (preinstalled on the runner image; installed only if missing)
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then sudo apt-get update -q && sudo apt-get install -y -q postgresql-16 postgresql-client-16; fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Text check
        working-directory: .
        run: .github/ci-run.sh "Text check" scripts/check-text.sh
      - name: Each change record names the guide chapters it changed (or "No guide change" and why)
        working-directory: .
        run: node scripts/check-change-guides.mjs
      - name: Applied migrations are never edited (names, numbers, history; docs/engineering-rules.md)
        working-directory: .
        run: node scripts/check-migrations.mjs
      - name: Store app config and listing text (no install, about a second)
        working-directory: apps/carmacars
        run: node scripts/check-app.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Poppler for the rasterized agreement test (blindspot/raster.test.ts)
        # Nov 11: apt-get update failed (exit 100) on the runners because of a broken third-party package list; only the
        # Ubuntu archive is used for this install, and it is retried
        run: |
          command -v pdftoppm >/dev/null && exit 0
          sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete || true
          for i in 1 2 3; do sudo apt-get update -q -o Acquire::Retries=3 && sudo apt-get install -y -q --no-install-recommends poppler-utils && exit 0; echo "::warning title=poppler::try $i failed"; sleep 20; done
          echo "::error title=poppler::poppler-utils install failed"; exit 1
      - run: npm run test:unit
      - run: npx tsc --noEmit -p tests/tsconfig.json
      - name: Types are generated from the schema
        run: |
          cp .env.example .env.local
          bash scripts/local-db.sh up --no-seed
          npm run db:types && git diff --exit-code src/lib/db/types.ts

  # ---------------------------------------------------------------- the database suite (every push), in slices
  # One job ran every test file in turn against one database: 35 minutes (run 43215627781: migrations 39 s, tests 2,100 s),
  # the longest wait before a deploy. Now each db job builds the same fresh database (every migration) and runs, in the
  # same order (scripts/test.sh, CARMACARS_TEST_SLICE): the base files 00_ to 98_, which build on each other's data, all
  # of them in every slice; then its share of the release files 99_* (a checksum of the file name, so a file keeps its
  # slice when others are added). A 99_ file must therefore not need the data of another 99_ file: one that does fails
  # here in its slice; give it its own data or a number below 99. db-suite waits for all slices, prints the one summary
  # in the format of scripts/test.sh, and fails when a slice failed, an assertion failed, or a test file was not
  # answered for exactly once (scripts/test-merge.sh). The slices, the 16 e2e jobs and fast together stay within 20 jobs
  # at once. To change the number of slices, change the lines marked "slices" below.
  db:
    name: db ${{ matrix.slice }}/3
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]   # slices
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 (preinstalled on the runner image; installed only if missing)
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then sudo apt-get update -q && sudo apt-get install -y -q postgresql-16 postgresql-client-16; fi
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Database suite (every migration, the base tests, this slice of the release tests)
        env:
          CARMACARS_TEST_SLICE: ${{ matrix.slice }}/3   # slices
          CARMACARS_TEST_RESULTS: ${{ runner.temp }}/db-results
        run: .github/ci-run.sh "Database ${{ matrix.slice }}/3" scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: db-results-${{ matrix.slice }}
          retention-days: 1
          path: ${{ runner.temp }}/db-results

  # The database suite passed: every slice succeeded and together they ran every test file once. deploy needs this job.
  db-suite:
    name: Database suite (every migration, every test)
    needs: db
    if: ${{ !cancelled() && needs.db.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: db-results-*
          path: ${{ runner.temp }}/db-results
      - name: One summary (every suite, TOTAL, each failed assertion)
        run: |
          set +e; .github/ci-run.sh "Database" scripts/test-merge.sh "$RUNNER_TEMP"/db-results/db-results-* | tee /tmp/db.log; s=${PIPESTATUS[0]}
          echo "::notice title=database::$(grep -E '^TOTAL' /tmp/db.log | sed -E 's/ +/ /g')"
          echo "database slices: ${{ needs.db.result }}"
          [ "${{ needs.db.result }}" = success ] || { echo "::error title=database suite failed::a db job failed (${{ needs.db.result }}); see its annotations"; exit 1; }
          exit $s

  # ---------------------------------------------------------------- the full suite (deploy, or full = true)
  # Sixteen jobs side by side (one job used to run everything in turn: 2.5 to 3.7 hours; eight jobs: 20 to 43 minutes,
  # the slowest an e2e quarter of 17 minutes followed by an Admin crawl part of 18). Each brings up its own local
  # stack, Worker build and server (.github/actions/full-stack, about 4 minutes), runs an eighth of the end-to-end tests
  # at one width (375 or 1440, with axe), and then, against the same server and the data its tests left, as the one job
  # did: the emails with database values (every job: together they render every email the tests queued) and its share
  # of the audits below (link check, copy lint, crawl as every role with Admin in 6 parts, SEO): one heavy audit a job.
  # The job named full waits for all sixteen and fails when one did, so deploy still needs full (and fast, db-suite).
  # docs/ci-minutes.md.
  e2e:
    name: e2e ${{ matrix.project }} ${{ matrix.shard }}/8${{ inputs.e2e_grep == '' && format(', {0}', matrix.label) || '' }}
    if: github.event_name == 'workflow_dispatch' && inputs.checks && (inputs.deploy || inputs.full)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Timings of run 43215627781 (8 jobs): setup 2.5-4 min, e2e quarters 8-17 (so eighths about 4-9), link check 6,
        # copy lint 9, SEO 9, crawl Admin quarters 10-18, va_cs with va_fleet 19.5, va_sales 11, va_finance 10.5, anon 8,
        # field 3.6, renter 2.8, owner and investor 2 each. Every test still runs once at each width (shard i/8), and
        # every audit and role is in exactly one job; the Admin crawl is in 6 parts (crawl-roles.mjs --part i/6).
        include:
          - { project: phone-375, shard: 1, label: 'link check, crawl owner', links: true, roles: owner, part: '1/1' }
          - { project: phone-375, shard: 2, label: 'crawl anon, investor', roles: 'anon,investor', part: '1/1' }
          - { project: phone-375, shard: 3, label: 'copy lint', copy: true }
          - { project: phone-375, shard: 4, label: 'SEO', seo: true }
          - { project: phone-375, shard: 5, label: 'crawl va_finance', roles: va_finance, part: '1/1' }
          - { project: phone-375, shard: 6, label: 'crawl admin 1 of 6', roles: admin, part: '1/6' }
          - { project: phone-375, shard: 7, label: 'crawl admin 2 of 6', roles: admin, part: '2/6' }
          - { project: phone-375, shard: 8, label: 'crawl field', roles: field, part: '1/1' }
          - { project: desktop-1440, shard: 1, label: 'crawl va_sales', roles: va_sales, part: '1/1' }
          - { project: desktop-1440, shard: 2, label: 'crawl admin 3 of 6', roles: admin, part: '3/6' }
          - { project: desktop-1440, shard: 3, label: 'crawl admin 4 of 6', roles: admin, part: '4/6' }
          - { project: desktop-1440, shard: 4, label: 'crawl va_cs', roles: va_cs, part: '1/1' }
          - { project: desktop-1440, shard: 5, label: 'crawl va_fleet', roles: va_fleet, part: '1/1' }
          - { project: desktop-1440, shard: 6, label: 'crawl admin 5 of 6', roles: admin, part: '5/6' }
          - { project: desktop-1440, shard: 7, label: 'crawl admin 6 of 6', roles: admin, part: '6/6' }
          - { project: desktop-1440, shard: 8, label: 'crawl renter', roles: renter, part: '1/1' }
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/full-stack
        with:
          save-caches: ${{ matrix.project == 'phone-375' && matrix.shard == 3 }}
      # r38: the Worker build of the full-stack step, run in workerd (wrangler dev, local mode, no secrets): health, home,
      # sign-in and a car page answer without a 5xx or a Worker crash. The tests above run next start, never the Worker, so
      # Nov 11's Error 1101 (Next 16.4.6: "Unexpected loadManifest(preview-props.json)") passed them all. One job is enough
      # (every job builds the same Worker); about a minute. deploy needs full, which needs this job.
      - name: Worker runtime smoke (workerd)
        if: matrix.project == 'desktop-1440' && matrix.shard == 4
        timeout-minutes: 6
        run: ../.github/ci-run.sh "Worker smoke" node scripts/worker-smoke.mjs
      - name: End to end, accessibility
        env:
          BASE_URL: http://localhost:3000
          PW_BLOB: ${{ matrix.project }}-${{ matrix.shard }}
          E2E_GREP: ${{ inputs.e2e_grep }}
        run: |
          set +e; ../.github/ci-run.sh "End to end" npx playwright test --project ${{ matrix.project }} --shard ${{ matrix.shard }}/8 ${E2E_GREP:+--pass-with-no-tests --grep "$E2E_GREP"} | tee /tmp/e2e.log; s=${PIPESTATUS[0]}
          echo "::notice title=e2e ${{ matrix.project }} ${{ matrix.shard }}/8::$(sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/e2e.log | grep -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)' | sed -E 's/^ +//' | paste -sd ';' -)"; exit $s
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-e2e-${{ matrix.project }}-${{ matrix.shard }}
          retention-days: 1
          path: web/blob-report
      - name: Settle
        if: ${{ !cancelled() && inputs.e2e_grep == '' && true }}
        # the local server rebuilds public pages on a 10 s tick, twice after a fleet change (the confirm pass):
        # let the last e2e change settle before the pages are crawled
        run: sleep 25
      - name: Link check
        if: ${{ !cancelled() && inputs.e2e_grep == '' && matrix.links }}
        run: |
          s=0
          npm run -s check:links > /tmp/links.log 2>&1 || s=1; tail -n 40 /tmp/links.log
          echo "::notice title=links::$(grep -E '^linkcheck' /tmp/links.log | paste -sd ';' -)"
          if [ $s -ne 0 ]; then echo "::error title=links failed::$(grep -vE '^linkcheck:' /tmp/links.log | head -n 25 | cut -c1-300 | paste -sd ';' -)"; fi
          exit $s
      - name: Copy lint
        if: ${{ !cancelled() && inputs.e2e_grep == '' && matrix.copy }}
        run: |
          s=0
          npm run -s check:copy > /tmp/copy.log 2>&1 || s=1; tail -n 40 /tmp/copy.log
          echo "::notice title=copy::$(grep -E '^copylint' /tmp/copy.log | paste -sd ';' -)"
          if [ $s -ne 0 ]; then echo "::error title=copy lint failed::$(grep -vE '^copylint:' /tmp/copy.log | head -n 25 | cut -c1-300 | paste -sd ';' -)"; fi
          exit $s
      - name: Crawl as ${{ matrix.roles }} ${{ matrix.part }}
        if: ${{ !cancelled() && inputs.e2e_grep == '' && matrix.roles }}
        run: |
          set +e; ../.github/ci-run.sh "Crawl" node tests/lint/crawl-roles.mjs --per-shape 1 --roles ${{ matrix.roles }} --part ${{ matrix.part }} --out reports/crawl.json > /tmp/crawl.log; s=$?
          tail -n 40 /tmp/crawl.log; echo "::notice title=crawl::$(grep -E '^crawl' /tmp/crawl.log | sed -E 's/ +/ /g' | paste -sd ';' -)"; exit $s
      - name: SEO
        if: ${{ !cancelled() && inputs.e2e_grep == '' && matrix.seo }}
        run: |
          set +e; ../.github/ci-run.sh "SEO" node tests/lint/seo-audit.mjs > /tmp/seo.log; s=$?
          tail -n 40 /tmp/seo.log; echo "::notice title=seo::$( (head -n 3 /tmp/seo.log; tail -n 3 /tmp/seo.log) | paste -sd ';' -)"; exit $s
      - name: Emails with database values
        if: ${{ !cancelled() && inputs.e2e_grep == '' && true }}
        run: |
          set +e; ../.github/ci-run.sh "Emails" node tests/lint/emails-db.mjs --no-shots > /tmp/emails.log; s=$?
          tail -n 40 /tmp/emails.log; echo "::notice title=emails::$(grep -E '^emails' /tmp/emails.log | paste -sd ';' -)"; exit $s
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-suite-${{ matrix.project }}-${{ matrix.shard }}
          retention-days: 7
          path: |
            web/test-results
            web/reports
            /tmp/serve.log

  # the sixteen reports as one: the same "e2e" notice as one run (passed, failed, flaky, skipped), and reports/e2e.json
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-e2e-*
          merge-multiple: true
          path: web/all-blob-reports
      - name: One report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/e2e.json
        run: |
          npx playwright merge-reports --reporter list,json ./all-blob-reports > /tmp/e2e.log 2>&1; s=$?
          grep -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)|^ +\[|✘|^ +[0-9]+\) ' /tmp/e2e.log | tail -n 60
          echo "::notice title=e2e::$(sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/e2e.log | grep -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)' | sed -E 's/^ +//' | paste -sd ';' -)"; exit $s
      - uses: actions/upload-artifact@v4
        if: needs.e2e.result == 'failure'
        with:
          name: e2e-report
          retention-days: 7
          path: web/reports/e2e.json

  lighthouse:
    name: Lighthouse (mobile; recorded)
    if: github.event_name == 'workflow_dispatch' && inputs.checks && (inputs.deploy || inputs.full) && inputs.lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true   # recorded, not gated (full does not wait for it)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/full-stack
      - name: Lighthouse (mobile; recorded)
        run: |
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" node tests/lint/lighthouse.mjs
          jq -r 'to_entries[] | "::notice title=lighthouse::\(.key) performance \(.value.performance), accessibility \(.value.accessibility), best practices \(.value.bestPractices), SEO \(.value.seo); LCP \(.value.lcp), CLS \(.value.cls), TBT \(.value.tbt)"' reports/lighthouse.json

  # The full suite passed: all sixteen jobs succeeded. deploy needs this job, as it needed the one full job before.
  full:
    needs: e2e
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.checks && (inputs.deploy || inputs.full) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job of the full suite passed
        run: |
          echo "full suite: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = success ] || { echo "::error title=full suite failed::one of the sixteen jobs failed (${{ needs.e2e.result }}); see its annotations"; exit 1; }

  # ---------------------------------------------------------------- deploy
  deploy:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.deploy
      && needs.fast.result != 'failure' && needs.db-suite.result != 'failure' && needs.full.result != 'failure'
      && (inputs.checks == false || (needs.fast.result == 'success' && needs.db-suite.result == 'success' && needs.full.result == 'success'))
    needs: [fast, db-suite, full]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: write   # the last step starts the guides workflow (the guides keep up with the portals, 0055)
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # the Quo phone line (0085): the CarmaCars workspace's key; kept in the vault too (deploy_quo_api_key)
      QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
      # r35 (0970): the site's Call button; r44 (2790): calls made and taken in the browser. TWILIO_AUTH_TOKEN is required
      # (every Twilio webhook is signed); TWILIO_TWIML_APP_SID is optional (the site finds or makes its TwiML App); unset: Quo
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
      TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
      TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
      # r35 (0990): the image model of the showroom listing photos (Google AI Studio); optional, without it the free showroom
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # r36 (2110): AI auto-replies on Messenger, Instagram and WhatsApp (the Meta app's secret checks the webhook; the WhatsApp
      # Cloud API token answers); optional, without them the Meta webhook answers nothing (or put them in the SOPS file)
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      # r35 (1202): the RentalCover partner API key (the Protection Plan's quotes); unset: the plan keeps its table price.
      # RENTALCOVER_API_BASE (repository variable): RentalCover's production URL once they give it; unset: their staging API
      RENTALCOVER_API_KEY: ${{ secrets.RENTALCOVER_API_KEY }}
      # r41 (2570): Amazon SES, the first email sender of send-outbox (docs/email-providers.md); optional, without the keys the
      # sender skips SES. AWS_SES_REGION (repository variable) defaults to ca-central-1; AWS_SES_CONFIGURATION_SET is optional
      AWS_SES_ACCESS_KEY_ID: ${{ secrets.AWS_SES_ACCESS_KEY_ID }}
      AWS_SES_SECRET_ACCESS_KEY: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
      AWS_SES_REGION: ${{ vars.AWS_SES_REGION }}
      AWS_SES_CONFIGURATION_SET: ${{ vars.AWS_SES_CONFIGURATION_SET }}
      # where Supabase is: the hosted project (default) or the company's own server (repository variable
      # DB_BACKEND=vps, infra/vps/CUTOVER.md; scripts/deploy/lib.sh). VPS_SSH_KEY is used only with vps.
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_ENV: ${{ inputs.environment }}
      # r42: set to vps after the switch to the company's server (docs/hosting/off-cloudflare.md): the Worker is then
      # deployed as a standby (no custom domains, no cron) and this job leaves the site's DNS and inbound mail alone
      WEB_LIVE_ON: ${{ vars.WEB_LIVE_ON }}
      PAGE_CACHE: ${{ inputs.page_cache || 'auto' }}
      APP_URL: https://carmacars.ca
      DOMAIN: carmacars.ca
      RUN: ${{ github.workspace }}/.github/ci-run.sh
    steps:
      - uses: actions/checkout@v4
      # r36: the deploy's secrets from secrets/deploy.sops.yaml (SOPS, age) with the one secret SOPS_AGE_KEY; a GitHub secret
      # still set keeps its value until it is deleted (docs/runbooks/sops-secrets.md). No key or no file: nothing changes.
      - name: Secrets from the SOPS file
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Target
        run: |
          # The repository secrets point at the production Supabase project; staging needs its own project
          # and secrets first (an environment named staging with its own SUPABASE_* secrets).
          if [ "$DEPLOY_ENV" = staging ] && [ -z "${{ vars.STAGING_READY }}" ]; then
            echo "::error::Staging has no Supabase project of its own yet; deploy production, or set up the staging environment (web/README.md, Deploy)."; exit 1
          fi
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Secrets from the Supabase project (keys, vault)
        run: $RUN "Secrets" scripts/deploy/supabase.sh secrets
      - name: Cloudflare token, page cache and file storage (R2, KV, D1), Turnstile, DNS for the custom domains
        env:
          # 0321: the photos' address when set as a repository variable (a CDN or another host); else the storage's own
          NEXT_PUBLIC_VEHICLE_PHOTOS_URL: ${{ vars.NEXT_PUBLIC_VEHICLE_PHOTOS_URL }}
        run: $RUN "Cloudflare" scripts/deploy/cloudflare.sh token resources subdomain turnstile dns images
      - name: Migrations (new ones only), Auth settings, Stripe webhook, outbox sender, owner debit, calendar sync, SMS hook secret
        continue-on-error: ${{ inputs.emergency == true }}
        run: $RUN "Supabase" scripts/deploy/supabase.sh migrate templates auth stripe outbox debit calsync smshook
      - name: The Quo phone line (the key, our webhook for the CarmaCars number and its signing secret; never another account)
        if: inputs.environment == 'production'
        continue-on-error: true
        run: $RUN "Quo" scripts/deploy/supabase.sh quo
      - name: Seed (content rows and the user guides, only where missing; the sample cars while the site has none)
        continue-on-error: ${{ inputs.emergency == true }}
        working-directory: web
        run: $RUN "Seed" node scripts/seed.mjs --production
      - name: File buckets and the stand-in photos (R2, or Supabase Storage when the account has no R2)
        continue-on-error: ${{ inputs.emergency == true }}
        run: |
          if [ "$STORAGE_PROVIDER" = supabase ]; then $RUN "Photos" scripts/deploy/supabase.sh storage photos
          else $RUN "Photos" scripts/deploy/cloudflare.sh photos; fi
      - name: The database answers quickly (after new migrations)
        if: ${{ !inputs.emergency }}
        run: |
          # Deploy runs 39289461880 and 39310793167 failed while building, right after migrations were applied: reads that
          # take about 75 ms were cancelled at the anon role's 3 s statement timeout. Every DDL statement of a migration
          # asks the database API to reload its schema cache, and the small database stays busy for a few minutes after
          # a large migration. The build starts once five reads in a row answer within a second (at most 10 minutes).
          ok=0; t0=$(date +%s)
          while [ $(( $(date +%s) - t0 )) -lt 600 ]; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' -X POST "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/site_settings_public" \
              -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" -H 'content-type: application/json' -d '{}' --max-time 10 || true)
            code=${out%% *}; secs=${out##* }
            if [ "$code" = 200 ] && awk "BEGIN { exit !($secs < 1) }"; then ok=$((ok + 1)); else ok=0; fi
            [ "$ok" -ge 5 ] && break
            sleep 5
          done
          echo "::notice title=deploy::Database API ready after $(( $(date +%s) - t0 )) s (last read: $out, $ok fast in a row)"
      - name: Build the Worker
        working-directory: web
        run: |
          # Public and non-secret settings: inlined by next build and compiled into the Worker by OpenNext.
          {
            echo "APP_ENV=$DEPLOY_ENV"
            echo "DATA_BACKEND=supabase"
            echo "NEXT_PUBLIC_APP_URL=$APP_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            # on the company's server: the session cookie keeps the hosted project's name (scripts/deploy/supabase.sh secrets)
            if [ -n "${NEXT_PUBLIC_SUPABASE_AUTH_COOKIE:-}" ]; then echo "NEXT_PUBLIC_SUPABASE_AUTH_COOKIE=$NEXT_PUBLIC_SUPABASE_AUTH_COOKIE"; fi
            echo "NEXT_PUBLIC_VEHICLE_PHOTOS_URL=$NEXT_PUBLIC_VEHICLE_PHOTOS_URL"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
            echo "TURNSTILE_PROVIDER=$TURNSTILE_PROVIDER"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
            echo "PAYMENTS_PROVIDER=stripe"
            echo "STORAGE_PROVIDER=$STORAGE_PROVIDER"
            echo "R2_BUCKET_PREFIX=carmacars-$([ "$DEPLOY_ENV" = staging ] && echo staging || echo prod)-"
            echo "MAPS_PROVIDER=${MAPS_PROVIDER:-fake}"
            # the store app's universal links and app links files (0390): public ids, repository variables (docs/apps/publish.md)
            if [ -n "${{ vars.APP_APPLE_TEAM_ID }}" ]; then echo "APP_APPLE_TEAM_ID=${{ vars.APP_APPLE_TEAM_ID }}"; fi
            if [ -n "${{ vars.APP_ANDROID_CERT_SHA256 }}" ]; then echo "APP_ANDROID_CERT_SHA256=${{ vars.APP_ANDROID_CERT_SHA256 }}"; fi
            echo "VIN_DECODER=vpic"
            echo "LLM_PROVIDER=workers-ai"
            echo "PHOTO_PROVIDER=cloudflare"
            echo "QUO_PROVIDER=quo"
            if [ -n "${{ vars.RENTALCOVER_API_BASE }}" ]; then echo "RENTALCOVER_API_BASE=${{ vars.RENTALCOVER_API_BASE }}"; fi
          } > .env.production
          # cf:build: the OpenNext build with the Worker size step and its budget check (scripts/worker-size.mjs)
          $RUN "Worker build" npm run -s cf:build
          # 2026-11-06: the build files of the deploys of the last 8 days stay served next to this build's, so a page
          # loaded before this deploy keeps its scripts and styles (scripts/deploy/keep-assets.mjs; never fails the deploy)
          if [ "$DEPLOY_ENV" = production ]; then node ../scripts/deploy/keep-assets.mjs .open-next/assets https://carmacars.ca || true; fi
      - name: Deploy the Worker (with its secrets)
        working-directory: web
        run: |
          umask 077
          f="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY: env.STRIPE_SECRET_KEY,
                  STRIPE_WEBHOOK_SECRET: env.STRIPE_WEBHOOK_SECRET, LINK_SIGNING_KEY: env.LINK_SIGNING_KEY,
                  PAYOUT_ENCRYPTION_KEY: env.PAYOUT_ENCRYPTION_KEY,
                  NEXT_PUBLIC_SUPABASE_URL: env.NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY: env.NEXT_PUBLIC_SUPABASE_ANON_KEY}
                 + (if env.SUPABASE_JWT_SECRET then {SUPABASE_JWT_SECRET: env.SUPABASE_JWT_SECRET} else {} end)
                 + (if env.TURNSTILE_SECRET_KEY then {TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY} else {} end)
                 + (if env.GOOGLE_MAPS_API_KEY then {GOOGLE_MAPS_API_KEY: env.GOOGLE_MAPS_API_KEY} else {} end)
                 + (if env.GOOGLE_REVIEWS_CLIENT_SECRET then {GOOGLE_REVIEWS_CLIENT_ID: env.GOOGLE_REVIEWS_CLIENT_ID, GOOGLE_REVIEWS_CLIENT_SECRET: env.GOOGLE_REVIEWS_CLIENT_SECRET} else {} end)
                 + (if env.QUO_API_KEY then {QUO_API_KEY: env.QUO_API_KEY} else {} end)
                 + (if env.GEMINI_API_KEY then {GEMINI_API_KEY: env.GEMINI_API_KEY} else {} end)
                 + (if env.META_APP_SECRET then {META_APP_SECRET: env.META_APP_SECRET} else {} end)
                 + (if env.WHATSAPP_TOKEN then {WHATSAPP_TOKEN: env.WHATSAPP_TOKEN} else {} end)
                 + (if env.RENTALCOVER_API_KEY then {RENTALCOVER_API_KEY: env.RENTALCOVER_API_KEY} else {} end)
                 + (if env.QUO_WEBHOOK_SECRET then {QUO_WEBHOOK_SECRET: env.QUO_WEBHOOK_SECRET} else {} end)
                 + (if env.TWILIO_ACCOUNT_SID and env.TWILIO_API_KEY and env.TWILIO_API_SECRET then {TWILIO_ACCOUNT_SID: env.TWILIO_ACCOUNT_SID, TWILIO_API_KEY: env.TWILIO_API_KEY, TWILIO_API_SECRET: env.TWILIO_API_SECRET} else {} end)
                 + (if env.TWILIO_CALLER_ID then {TWILIO_CALLER_ID: env.TWILIO_CALLER_ID} else {} end)
                 + (if env.TWILIO_AUTH_TOKEN then {TWILIO_AUTH_TOKEN: env.TWILIO_AUTH_TOKEN} else {} end)
                 + (if env.TWILIO_TWIML_APP_SID then {TWILIO_TWIML_APP_SID: env.TWILIO_TWIML_APP_SID} else {} end)
                 + (if env.AUTH_SMS_HOOK_SECRET then {AUTH_SMS_HOOK_SECRET: env.AUTH_SMS_HOOK_SECRET} else {} end)
                 + (if env.VAPID_PRIVATE_KEY then {VAPID_PUBLIC_KEY: env.VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY: env.VAPID_PRIVATE_KEY} else {} end)
                 + (if env.WALLET_PASS_CERT and env.WALLET_PASS_KEY and env.WALLET_WWDR_CERT and env.WALLET_PASS_TYPE_ID and env.WALLET_TEAM_ID
                    then {WALLET_PASS_CERT: env.WALLET_PASS_CERT, WALLET_PASS_KEY: env.WALLET_PASS_KEY, WALLET_WWDR_CERT: env.WALLET_WWDR_CERT,
                          WALLET_PASS_TYPE_ID: env.WALLET_PASS_TYPE_ID, WALLET_TEAM_ID: env.WALLET_TEAM_ID} else {} end)
                 + (if env.FCM_SERVICE_ACCOUNT then {FCM_SERVICE_ACCOUNT: env.FCM_SERVICE_ACCOUNT} else {} end)' > "$f"
          # R23 (0222): the Cloudflare Email Service binding, once the owner has set Email Service up for carmacars.ca and set
          # the repository variable CF_EMAIL_BINDING to 1 (docs/changes/2026-11-03-cloudflare-email.md); without it the
          # outbox sends through Resend as before
          # 0321: 1, true, yes, on or EMAIL (any case) turn it on; the annotation says whether it was added and why
          ../scripts/deploy/email-binding.sh wrangler.jsonc "$DEPLOY_ENV" "${{ vars.CF_EMAIL_BINDING }}"
          if [ "$DEPLOY_ENV" = staging ]; then
            $RUN "Deploy" npx opennextjs-cloudflare deploy -- --env staging --secrets-file "$f"
          else
            $RUN "Deploy" npx opennextjs-cloudflare deploy -- --secrets-file "$f"
          fi
          rm -f "$f"
      # 0321: every feature waiting on an owner step, with the exact step, on every production deploy (never hidden)
      - name: Waiting on an owner step (Cloudflare email, Wallet certificate, Meta Page token, GoHighLevel tokens, RentalCoverage link)
        if: inputs.environment == 'production'
        continue-on-error: true
        env:
          CF_EMAIL_BINDING: ${{ vars.CF_EMAIL_BINDING }}
        run: scripts/deploy/owner-steps.sh
      # 0601: the emails skipped as stale in the last day, by audience and code (counts only)
      - name: Stale emails (counts skipped as stale)
        if: inputs.environment == 'production'
        continue-on-error: true
        run: scripts/deploy/outbox-stale.sh
      # r29 C4 (0584): the month's owner invoices against each car's signed terms, read only (owners by a short reference)
      - name: Fee check (owner invoices against the signed terms)
        if: inputs.environment == 'production'
        continue-on-error: true
        run: scripts/deploy/fee-audit.sh
      - name: Turo by email (Email Routing on in.carmacars.ca and its rule to the Worker; never the root domain's mail)
        if: inputs.environment == 'production'
        continue-on-error: true
        run: $RUN "Turo email" scripts/deploy/cloudflare.sh email
      - name: AI crawlers (read only; warns when Cloudflare blocks AI crawlers or rewrites robots.txt, docs/changes/2026-10-23-ai-search.md)
        if: inputs.environment == 'production'
        continue-on-error: true
        run: $RUN "AI crawlers" scripts/deploy/cloudflare.sh crawlers
      - name: The site answers
        if: inputs.environment == 'production'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://carmacars.ca/ || true)
            [ "$code" = 200 ] && break; sleep 10
          done
          echo "::notice title=deploy::https://carmacars.ca answered $code; /cars $(curl -s -o /dev/null -w '%{http_code}' https://carmacars.ca/cars); photos $(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_VEHICLE_PHOTOS_URL/.seeded/stand-in-photos-v1")"
      # r39 (2400): the site checks itself (web/scripts/verify-live.mjs --selfqa, no browser, under three minutes): a 5xx or Error 1101
      # on a key public page or the sign-in page fails the deploy; listing photo and SEO problems are warnings, saved for the Admins
      # with the staff alert site_selfqa (server_site_selfqa, with the database's own findings)
      - name: Self-check of the live site (fails on a 5xx or Error 1101; warnings to the Admins)
        if: inputs.environment == 'production'
        working-directory: web
        timeout-minutes: 4
        env:
          BASE_URL: ${{ env.APP_URL }}
        run: $RUN "Self-check" node scripts/verify-live.mjs --selfqa --out "$RUNNER_TEMP/selfqa"
      - name: Sign-in by phone (Supabase Auth's phone provider and its Send SMS hook to the Worker; production only)
        if: inputs.environment == 'production'
        continue-on-error: true
        run: $RUN "Phone sign-in" scripts/deploy/supabase.sh phoneauth
      - name: The stored guide PDFs (the committed PDFs, uploaded once where none is stored yet)
        if: inputs.environment == 'production'
        working-directory: web
        continue-on-error: true
        run: $RUN "Guide PDFs" node scripts/guides-pdf.mjs --base "$APP_URL" --committed
      - name: The guides keep up (the guides workflow, after a deploy; it stops at once when web/src and docs/guides did not change)
        if: inputs.environment == 'production'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run guides.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f auto=true
          echo "::notice title=guides::started the guides workflow (auto) for ${GITHUB_SHA::7}: screenshots, the text of the sections that changed, the PDFs"
      - name: Crawl warm-up and Search Console (the gsc workflow, after a deploy; 0124)
        if: inputs.environment == 'production'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gsc.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f submit=true -f warm=3000 -f indexnow_rounds=10
          echo "::notice title=gsc::started the gsc workflow: the first 3,000 priority addresses fetched once, the sitemaps submitted, IndexNow batches sent"
      # 0466: the Admins get a staff alert when a deploy finishes or fails (Alerts, and the phone; never fails the deploy).
      # Runs only once the Secrets step gave this job the database address and its server key.
      - name: Tell the Admins (staff alert deploy_result)
        if: ${{ always() && inputs.deploy && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        continue-on-error: true
        env:
          RESULT: ${{ job.status }}
          TARGET: ${{ inputs.environment }}
        run: |
          curl -s -o /dev/null --max-time 15 -X POST "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/server_deploy_result" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H 'content-type: application/json' \
            -d "$(jq -n --arg s "$RESULT" --arg sha "$GITHUB_SHA" --arg e "$TARGET" '{p: {status: $s, sha: $sha, environment: $e}}')" || true

name: ci

# Every push and pull request: the database suite (all migrations, all tests) and the web app's
# gates (lint, types, build, Worker build, end-to-end at 375 and 1440 with axe, link check, copy lint).
# Deploy: run by hand (Actions > ci > Run workflow > deploy = true), after the same checks. It needs only
# the five repository secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID): everything else is read at deploy time from the
# Supabase project (its keys, and the deploy_* secrets in its vault). See scripts/deploy/ and
# web/README.md, "Deploy". A failing step puts its last output lines into the run's annotations.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: [database, web]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENV: ${{ inputs.environment }}
      APP_URL: https://carmacars.ca
      DOMAIN: carmacars.ca
      NEXT_TELEMETRY_DISABLED: '1'
      RUN: ${{ github.workspace }}/.github/ci-run.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Target
        run: |
          # The repository secrets point at the production Supabase project; staging needs its own project
          # and secrets first (an environment named staging with its own SUPABASE_* secrets).
          if [ "$DEPLOY_ENV" = staging ] && [ -z "${{ vars.STAGING_READY }}" ]; then
            echo "::error::Staging has no Supabase project of its own yet; deploy production, or set up the staging environment (web/README.md, Deploy)."; exit 1
          fi
      - run: npm ci
        working-directory: web
      - name: Secrets from the Supabase project (keys, vault)
        run: $RUN "Secrets" scripts/deploy/supabase.sh secrets
      - name: Cloudflare token, R2 buckets, D1, Turnstile, DNS for the custom domains
        run: $RUN "Cloudflare" scripts/deploy/cloudflare.sh token resources turnstile dns
      - name: Migrations (new ones only), Auth settings, Stripe webhook, outbox sender
        run: $RUN "Supabase" scripts/deploy/supabase.sh migrate auth stripe outbox
      - name: Seed (content rows; the sample cars while the site has none)
        working-directory: web
        run: $RUN "Seed" node scripts/seed.mjs --production
      - name: Stand-in photos into the public bucket
        run: $RUN "Photos" scripts/deploy/cloudflare.sh photos
      - name: Build the Worker
        working-directory: web
        run: |
          # Public and non-secret settings: inlined by next build and compiled into the Worker by OpenNext.
          {
            echo "APP_ENV=$DEPLOY_ENV"
            echo "DATA_BACKEND=supabase"
            echo "NEXT_PUBLIC_APP_URL=$APP_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            echo "NEXT_PUBLIC_VEHICLE_PHOTOS_URL=$APP_URL/media"
            echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
            echo "TURNSTILE_PROVIDER=$TURNSTILE_PROVIDER"
            echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY=$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
            echo "PAYMENTS_PROVIDER=stripe"
            echo "STORAGE_PROVIDER=r2-binding"
            echo "R2_BUCKET_PREFIX=carmacars-$([ "$DEPLOY_ENV" = staging ] && echo staging || echo prod)-"
            echo "MAPS_PROVIDER=${{ vars.MAPS_PROVIDER || 'fake' }}"
            echo "VIN_DECODER=vpic"
          } > .env.production
          $RUN "Worker build" npx opennextjs-cloudflare build
      - name: Deploy the Worker (with its secrets)
        working-directory: web
        run: |
          umask 077
          f="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{SUPABASE_SERVICE_ROLE_KEY: env.SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY: env.STRIPE_SECRET_KEY,
                  STRIPE_WEBHOOK_SECRET: env.STRIPE_WEBHOOK_SECRET, LINK_SIGNING_KEY: env.LINK_SIGNING_KEY,
                  PAYOUT_ENCRYPTION_KEY: env.PAYOUT_ENCRYPTION_KEY}
                 + (if env.TURNSTILE_SECRET_KEY then {TURNSTILE_SECRET_KEY: env.TURNSTILE_SECRET_KEY} else {} end)' > "$f"
          if [ "$DEPLOY_ENV" = staging ]; then
            $RUN "Deploy" npx opennextjs-cloudflare deploy -- --env staging --secrets-file "$f"
          else
            $RUN "Deploy" npx opennextjs-cloudflare deploy -- --secrets-file "$f"
          fi
          rm -f "$f"
      - name: The site answers
        if: inputs.environment == 'production'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://carmacars.ca/ || true)
            [ "$code" = 200 ] && break; sleep 10
          done
          echo "::notice title=deploy::https://carmacars.ca answered $code; /cars $(curl -s -o /dev/null -w '%{http_code}' https://carmacars.ca/cars); /media $(curl -s -o /dev/null -w '%{http_code}' https://carmacars.ca/media/.seeded/stand-in-photos-v1)"

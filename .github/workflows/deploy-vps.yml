name: deploy-vps

# Release 42: the website built as a Node server and run on the company's server, next to its Supabase stack
# (docs/hosting/off-cloudflare.md). r48 (3070): every Cloudflare step of the move is done here through the API with the CI
# token (scripts/deploy/cf-site.sh), with no dashboard click and no new secret or variable: the inputs web_on_vps (on) and
# hostnames stand in for the repository variables WEB_ON_VPS and WEB_VPS_HOSTNAMES, which this session cannot set.
#   gh workflow run deploy-vps.yml -f action=deploy    then    gh workflow run deploy-vps.yml -f action=switch
#   action  deploy    the Node smoke first (below), then: Cloudflare step A (the `new` record proxied to the server,
#                     visitor location headers, SSL Full (strict)), the image built from this commit, sent, started,
#                     Caddy's site file with the Cloudflare Origin CA certificate, /api/health on the first hostname,
#                     the free inbound email forwarder. Visitors still reach the Worker
#           switch    no build: Cloudflare step B (the Worker's cron trigger deleted, its carmacars.ca and www domains
#                     removed, A records proxied to the server), then the server's cron on (only when the Worker's is
#                     off) and inbound email to the forwarder (cron and email default to on and forwarder here)
#           rollback  B reversed: the server's cron off, the A records removed, the Worker's domains and cron back,
#                     inbound email back to the Worker
#           rollback-image  the image that ran before the last deploy (DNS unchanged)
#   r50 (4800) self-healing: every deploy installs the heal agent (infra/vps/bin/heal-agent, carmacars-heal-agent.timer, every
#                     minute) and keeps the build before it. A build that never gets healthy goes back to that one at once (the
#                     deploy fails); within 30 minutes of a deploy the agent goes back to it too when the site stays unhealthy or
#                     its server errors spike (the database's engine queues rollback_web), and the Admins are told once.
#           test      only the Node smoke: the standalone build and the Node entry on the runner with the local stack,
#                     the smoke script and an end-to-end subset (sign-in, the Admin portal). Needs no secret, no server
#   email   keep      leave the Email Routing rules (switch: forwarder; rollback: worker)
#           forwarder mail to in.carmacars.ca goes to the free forwarder Worker, which posts it to the server
#           worker    back to the website Worker
#   cron    keep      leave the server's setting (switch: on; rollback: off)
#           on / off  the minute tick of the job routes on the server: on only once the Worker's cron trigger is off
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy, switch (DNS to the server), rollback (DNS back to the Worker), rollback-image, test
        type: choice
        options: [deploy, switch, rollback, rollback-image, test]
        default: deploy
      cron:
        description: The job tick on the server (on only after the Worker's cron is off)
        type: choice
        options: [keep, 'on', 'off']
        default: keep
      email:
        description: Inbound email (forwarder at the switch; worker to go back)
        type: choice
        options: [keep, forwarder, worker]
        default: keep
      web_on_vps:
        description: The site on the company's server (stands in for the repository variable WEB_ON_VPS)
        type: boolean
        default: true
      hostnames:
        description: The hostnames Caddy serves, the health-checked one first (stands in for WEB_VPS_HOSTNAMES)
        type: string
        default: new.carmacars.ca,carmacars.ca,www.carmacars.ca

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # The switch tested before DNS changes: HOSTING_TARGET=node built on the runner (7 GB of memory), the Node entry started
  # with the local stack (test data, no secret), then the smoke script (health, home, sign-in, the fleet, a car page,
  # the nonce policy, inbound email signed and unsigned) and the sign-in and Admin end-to-end tests against it.
  node-smoke:
    if: inputs.action == 'deploy' || inputs.action == 'test'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/full-stack
        with:
          build: node
      - name: The Cloudflare cutover script against a stand-in of the API (steps A and B, rollback, Origin CA, permissions)
        run: ../.github/ci-run.sh "Cloudflare cutover" node --test ../scripts/deploy/cf-site.test.mjs
      - name: Workers AI credentials against a stand-in of the API (the secret, a narrow token, the CI token, the permission named)
        run: ../.github/ci-run.sh "Workers AI credentials" node --test ../scripts/deploy/workers-ai-cred.test.mjs
      # r48 part AI: the server's local model in its container (the same image and pinned model as production), then the chat
      # and the staff assistant answer with it. Its absence (a download that fails on the runner) is a warning, never a failure.
      - name: Local model container (Ollama, the pinned text model)
        id: llm
        continue-on-error: true
        run: |
          set -euo pipefail
          set -a; . ../infra/vps/ai/models.env; set +a
          docker run -d --name carmacars-llm -p 11434:11434 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_CONTEXT_LENGTH=8192 "$OLLAMA_IMAGE" > /dev/null
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags > /dev/null && break; sleep 2; done
          docker exec carmacars-llm ollama pull "$LOCAL_LLM_MODEL" > /dev/null
          id=$(docker exec carmacars-llm ollama list | awk -v m="$LOCAL_LLM_MODEL" '$1 == m {print $2}')
          [ "${id:0:12}" = "$LOCAL_LLM_DIGEST" ] || { echo "::error title=node smoke::$LOCAL_LLM_MODEL has digest $id, not the pinned $LOCAL_LLM_DIGEST"; exit 1; }
          echo "::notice title=node smoke::local model $LOCAL_LLM_MODEL ($id) ready"
      - name: Chat and the staff assistant answer with the local model
        if: steps.llm.outcome == 'success'
        run: |
          set -a; . ../infra/vps/ai/models.env; set +a
          LOCAL_LLM_URL=http://127.0.0.1:11434 ../.github/ci-run.sh "Local model smoke" node --experimental-strip-types --no-warnings scripts/ai-local-smoke.mjs
      - name: The local model was not available on the runner
        if: steps.llm.outcome != 'success'
        run: echo "::warning title=node smoke::the local model container did not start or download on the runner; the chat and assistant check with it was skipped (the chain's unit tests still ran)"
      - name: Node entry smoke (pages, headers, inbound email)
        run: ../.github/ci-run.sh "Node smoke" node --no-warnings scripts/node-smoke.mjs
      - name: End to end against the Node entry (sign-in, the Admin portal)
        env:
          BASE_URL: http://localhost:3000
        run: ../.github/ci-run.sh "End to end (Node entry)" npx playwright test tests/e2e/signin.spec.ts tests/e2e/admin.spec.ts --project desktop-1440
      - name: The server's last lines
        if: failure()
        run: tail -n 80 /tmp/serve.log || true

  # r50 hotfix2: read only. What the server's Caddy hands out for api., meet. and the web hostnames, Caddy's certificate log
  # lines and the zone's A records with their proxy state. Fixed commands only (scripts/deploy/tls-report-remote.sh).
  tls-report:
    if: inputs.action == 'test'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DOMAIN: carmacars.ca
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare records (read)
        run: scripts/deploy/cf-site.sh records || true
      - name: Certificates on the server (read)
        run: scripts/deploy/web-vps.sh tls-report

  deploy-vps:
    needs: node-smoke
    if: ${{ !cancelled() && (inputs.web_on_vps || vars.WEB_ON_VPS == '1') && inputs.action != 'test' && (inputs.action != 'deploy' || needs.node-smoke.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Workers AI over its REST API (the free daily allowance): a token with Account > Workers AI > Read only
      WORKERS_AI_API_TOKEN: ${{ secrets.WORKERS_AI_API_TOKEN }}
      QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
      TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
      TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      RENTALCOVER_API_KEY: ${{ secrets.RENTALCOVER_API_KEY }}
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_ENV: production
      APP_URL: https://carmacars.ca
      DOMAIN: carmacars.ca
      WEB_VPS_HOSTNAMES: ${{ inputs.hostnames || vars.WEB_VPS_HOSTNAMES }}
      # the server's address for the A records (an IPv4 address or a name; else infra/vps/host)
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # switch: cron on and email to the forwarder unless told otherwise; rollback: cron off and email to the Worker
      WEB_CRON: ${{ inputs.action == 'rollback' && 'off' || (inputs.action == 'switch' && inputs.cron == 'keep') && 'on' || inputs.cron }}
      WEB_EMAIL: ${{ inputs.action == 'rollback' && 'worker' || (inputs.action == 'switch' && inputs.email == 'keep') && 'forwarder' || inputs.email }}
      # cloudflare (the default): Cloudflare's free proxy in front of the server (location headers, static file cache,
      # DDoS protection); off: DNS-only records
      WEB_PROXY: ${{ vars.WEB_PROXY }}
      # files: production keeps them in Supabase Storage on the server (FILES_ON_R2 was never set). Only if they are ever
      # moved to R2: FILES_ON_R2=yes and the two R2 S3 keys below (R2 is free under 10 GB)
      FILES_ON_R2: ${{ vars.FILES_ON_R2 }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RUN: ${{ github.workspace }}/.github/ci-run.sh
    steps:
      - uses: actions/checkout@v4
      - name: Rollback of the image (the one that ran before the last deploy)
        if: inputs.action == 'rollback-image'
        run: $RUN "Rollback" scripts/deploy/web-vps.sh rollback
      # B: the Worker's cron, domains and routes off, carmacars.ca and www to the server (CF_WORKER_CRON says if the cron is gone)
      - name: Cloudflare step B (the Worker's cron and domains off, the site's records to the server)
        if: inputs.action == 'switch'
        run: $RUN "Cloudflare B" scripts/deploy/cf-site.sh switch
      - name: Switch on the server (cron, Caddy; no build)
        if: inputs.action == 'switch'
        run: |
          # the jobs must never run twice: the server's cron goes on only once the Worker's trigger is gone
          if [ "$WEB_CRON" = on ] && [ "${CF_WORKER_CRON:-unknown}" != off ]; then
            echo "::warning title=deploy-vps::The Worker's cron trigger is still there (${CF_WORKER_CRON:-unknown}): the server's cron stays off"; export WEB_CRON=off
          fi
          $RUN "Switch" scripts/deploy/web-vps.sh switch
      # the rollback of B: the server's cron off first, then the Worker gets its domains and cron back
      - name: Rollback on the server (cron off)
        if: inputs.action == 'rollback'
        run: $RUN "Server cron off" scripts/deploy/web-vps.sh switch
      - name: Cloudflare step B reversed (the records removed, the Worker's domains and cron back)
        if: inputs.action == 'rollback'
        run: $RUN "Cloudflare B back" scripts/deploy/cf-site.sh unswitch
      - name: Secrets from the SOPS file
        if: inputs.action == 'deploy'
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Secrets from the Supabase project (keys, vault)
        if: inputs.action == 'deploy'
        run: $RUN "Secrets" scripts/deploy/supabase.sh secrets
      - name: Turnstile keys (read; the widget exists since the first Worker deploy)
        if: inputs.action == 'deploy'
        run: $RUN "Turnstile" scripts/deploy/cloudflare.sh token turnstile
      - name: Settings (public ones for the build, all of them for the server)
        if: inputs.action == 'deploy'
        env:
          PHOTOS_URL: ${{ vars.NEXT_PUBLIC_VEHICLE_PHOTOS_URL }}
          APP_APPLE_TEAM_ID: ${{ vars.APP_APPLE_TEAM_ID }}
          APP_ANDROID_CERT_SHA256: ${{ vars.APP_ANDROID_CERT_SHA256 }}
          RENTALCOVER_API_BASE: ${{ vars.RENTALCOVER_API_BASE }}
        run: |
          set -euo pipefail
          export APP_ENV=production DATA_BACKEND=supabase NEXT_PUBLIC_APP_URL="$APP_URL" PAYMENTS_PROVIDER=helcim VIN_DECODER=vpic QUO_PROVIDER=quo AUTH_OAUTH_PROVIDERS=google
          export MAPS_PROVIDER="${MAPS_PROVIDER:-fake}"
          # files: Supabase Storage on the server (the Worker's R2 bindings do not exist there); photos from its public bucket
          export STORAGE_PROVIDER=supabase
          if [ "${FILES_ON_R2:-no}" = yes ]; then
            # the same buckets the Worker's bindings used, over R2's S3 API: no file is copied
            [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ] && [ -n "${PHOTOS_URL:-}" ] || { echo "::error title=deploy-vps::FILES_ON_R2=yes needs the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY and the variable NEXT_PUBLIC_VEHICLE_PHOTOS_URL (the public bucket's address)"; exit 1; }
            export STORAGE_PROVIDER=r2 R2_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" R2_BUCKET_PREFIX=carmacars-prod-
          fi
          export NEXT_PUBLIC_VEHICLE_PHOTOS_URL="${PHOTOS_URL:-$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/public/vehicle-public}"
          # AI (r48 part AI, docs/hosting/off-cloudflare.md 2.2): every call goes down the chain Workers AI -> the server's own
          # models -> Gemini (not for private features), with no new secret. Workers AI's token: the WORKERS_AI_API_TOKEN secret,
          # else a Workers-AI-only token made by the CI token; never the CI token itself (it may edit DNS), so without either the
          # server has no Workers AI. One cheap probe says whether it may run Workers AI and names the permission to add when not ("Workers AI Read"). Never a failed deploy.
          node scripts/deploy/workers-ai-cred.mjs "$RUNNER_TEMP/workers-ai.json" || echo '{"token":""}' > "$RUNNER_TEMP/workers-ai.json"
          WORKERS_AI_API_TOKEN="$(jq -r '.token // ""' "$RUNNER_TEMP/workers-ai.json")"; export WORKERS_AI_API_TOKEN
          rm -f "$RUNNER_TEMP/workers-ai.json"
          {
            echo "### AI on the server"
            if [ -n "$WORKERS_AI_API_TOKEN" ]; then echo "- Workers AI: on (the free 10,000 neurons a day, behind the usage guard)"; else echo "- Workers AI: off. Add **Account > Workers AI Read** to the CLOUDFLARE_API_TOKEN token (or a WORKERS_AI_API_TOKEN secret with it)"; fi
            echo "- The server's own models (infra/vps/ai/models.env): warming up in the background after the deploy, then on"
            if [ -n "${GEMINI_API_KEY:-}" ]; then echo "- Gemini: last, for what is not private"; else echo "- Gemini: not set"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # the server's own models (infra/vps/ai): the containers on the Supabase stack's network, the pinned names and digests
          set -a; . infra/vps/ai/models.env; set +a
          export LOCAL_LLM_URL=http://carmacars-llm:11434 LOCAL_STT_URL=http://carmacars-stt:8080
          # never the fake on the server: the chain always has the local models (and Workers AI or Gemini when set)
          export LLM_PROVIDER=workers-ai
          export PHOTO_PROVIDER=cloudflare
          scripts/deploy/web-vps.sh envfile "$RUNNER_TEMP/web.env"
          # the build reads the same public settings as the Worker build (web/.env.production); no secret is written there
          grep -E "^(APP_ENV|DATA_BACKEND|NEXT_PUBLIC_[A-Z_]+|TURNSTILE_PROVIDER|PAYMENTS_PROVIDER|STORAGE_PROVIDER|MAPS_PROVIDER|VIN_DECODER|LLM_PROVIDER|PHOTO_PROVIDER|QUO_PROVIDER|RENTALCOVER_API_BASE|APP_APPLE_TEAM_ID|APP_ANDROID_CERT_SHA256)=" "$RUNNER_TEMP/web.env" \
            | sed -E "s/^([A-Z0-9_]+)='(.*)'$/\1=\2/" > web/.env.production
      # A: idempotent; a permission the token lacks is named and the deploy goes on (docs/hosting/off-cloudflare.md, 6)
      - name: Cloudflare step A (the new record, location headers, SSL Full (strict))
        if: inputs.action == 'deploy'
        run: $RUN "Cloudflare A" scripts/deploy/cf-site.sh prepare
      - name: Build the image (Next.js standalone, HOSTING_TARGET=node)
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          # the user guides' images live outside web/ (docs/guides): copied into web/public here, where the image build finds them
          node web/scripts/guide-assets.mjs
          $RUN "Image build" docker build -f infra/vps/web/Dockerfile --build-arg DEPLOY_VERSION="$tag" --secret id=buildenv,src="$RUNNER_TEMP/web.env" -t "carmacars-web:$tag" web
          docker save "carmacars-web:$tag" | gzip > "$RUNNER_TEMP/web-image.tgz"
          echo "WEB_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "::notice title=deploy-vps::image carmacars-web:$tag, $(du -h "$RUNNER_TEMP/web-image.tgz" | cut -f1) compressed"
      - name: To the server (start, health, Caddy's site file), then /api/health from outside
        if: inputs.action == 'deploy'
        run: $RUN "Server" scripts/deploy/web-vps.sh ship "$RUNNER_TEMP/web-image.tgz" "$RUNNER_TEMP/web.env"
      # Inbound email without Workers Paid: the forwarder is deployed on every deploy (it receives nothing until the rules
      # point at it); a failure only fails the job when the rules are being pointed at it in this run
      - name: Inbound email forwarder (a Worker on Cloudflare's free plan)
        if: inputs.action == 'deploy'
        continue-on-error: ${{ env.WEB_EMAIL != 'forwarder' }}
        run: $RUN "Email forwarder" scripts/deploy/web-vps.sh forwarder
      - name: Inbound email rules (to the forwarder, or back to the website Worker)
        if: env.WEB_EMAIL != 'keep' && inputs.action != 'rollback-image'
        run: $RUN "Email rules" scripts/deploy/web-vps.sh email "$WEB_EMAIL"
      - name: Remove the settings file
        if: always()
        run: rm -f "$RUNNER_TEMP/web.env" "$RUNNER_TEMP/web-image.tgz" web/.env.production

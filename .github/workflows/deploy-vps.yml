name: deploy-vps

# Release 42: the website built as a Node server and run on the company's server, next to its Supabase stack
# (docs/hosting/off-cloudflare.md). OFF until the repository variable WEB_ON_VPS is 1: without it the job is skipped.
# It never changes DNS and never touches the Cloudflare Worker (ci.yml's deploy keeps doing that), so running it does not
# move a single visitor: the site answers on the hostnames of the repository variable WEB_VPS_HOSTNAMES only
# (a temporary hostname first; the public ones are added there for the DNS switch).
#   action  deploy    the Node smoke first (below), then: build the image from this commit, send it, start it, load
#                     Caddy's site file, check /api/health, deploy the free inbound email forwarder
#           rollback  the image that ran before the last deploy
#           switch    no build (two minutes): the running image restarted with the cron setting, Caddy reloaded so it
#                     gets the certificates of hostnames whose DNS has just moved, then the email rules. The DNS switch
#           test      only the Node smoke: the standalone build and the Node entry on the runner with the local stack,
#                     the smoke script and an end-to-end subset (sign-in, the Admin portal). Needs no secret, no server
#   email   keep      leave the Email Routing rules
#           forwarder mail to in.carmacars.ca goes to the free forwarder Worker, which posts it to the server
#           worker    back to the website Worker (the rollback)
#   cron    keep      leave the server's setting (off on a first deploy)
#           on / off  the minute tick of the job routes on the server: on only once the Worker's cron trigger is off
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy or rollback
        type: choice
        options: [deploy, rollback, switch, test]
        default: deploy
      cron:
        description: The job tick on the server (on only after the Worker's cron is off)
        type: choice
        options: [keep, 'on', 'off']
        default: keep
      email:
        description: Inbound email (forwarder at the switch; worker to go back)
        type: choice
        options: [keep, forwarder, worker]
        default: keep

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # The switch tested before DNS changes: HOSTING_TARGET=node built on the runner (7 GB of memory), the Node entry started
  # with the local stack (test data, no secret), then the smoke script (health, home, sign-in, the fleet, a car page,
  # the nonce policy, inbound email signed and unsigned) and the sign-in and Admin end-to-end tests against it.
  node-smoke:
    if: inputs.action == 'deploy' || inputs.action == 'test'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/full-stack
        with:
          build: node
      - name: Node entry smoke (pages, headers, inbound email)
        run: ../.github/ci-run.sh "Node smoke" node --no-warnings scripts/node-smoke.mjs
      - name: End to end against the Node entry (sign-in, the Admin portal)
        env:
          BASE_URL: http://localhost:3000
        run: ../.github/ci-run.sh "End to end (Node entry)" npx playwright test tests/e2e/signin.spec.ts tests/e2e/admin.spec.ts --project desktop-1440
      - name: The server's last lines
        if: failure()
        run: tail -n 80 /tmp/serve.log || true

  deploy-vps:
    needs: node-smoke
    if: ${{ !cancelled() && vars.WEB_ON_VPS == '1' && inputs.action != 'test' && (inputs.action != 'deploy' || needs.node-smoke.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Workers AI over its REST API (the free daily allowance): a token with Account > Workers AI > Read only
      WORKERS_AI_API_TOKEN: ${{ secrets.WORKERS_AI_API_TOKEN }}
      QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
      TWILIO_API_SECRET: ${{ secrets.TWILIO_API_SECRET }}
      TWILIO_CALLER_ID: ${{ secrets.TWILIO_CALLER_ID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_TWIML_APP_SID: ${{ secrets.TWILIO_TWIML_APP_SID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      RENTALCOVER_API_KEY: ${{ secrets.RENTALCOVER_API_KEY }}
      DB_BACKEND: ${{ vars.DB_BACKEND }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      DEPLOY_ENV: production
      APP_URL: https://carmacars.ca
      DOMAIN: carmacars.ca
      WEB_VPS_HOSTNAMES: ${{ vars.WEB_VPS_HOSTNAMES }}
      WEB_CRON: ${{ inputs.cron }}
      # cloudflare (the default): Cloudflare's free proxy in front of the server (location headers, static file cache,
      # DDoS protection); off: DNS-only records
      WEB_PROXY: ${{ vars.WEB_PROXY }}
      # files: production keeps them in Supabase Storage on the server (FILES_ON_R2 was never set). Only if they are ever
      # moved to R2: FILES_ON_R2=yes and the two R2 S3 keys below (R2 is free under 10 GB)
      FILES_ON_R2: ${{ vars.FILES_ON_R2 }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RUN: ${{ github.workspace }}/.github/ci-run.sh
    steps:
      - uses: actions/checkout@v4
      - name: Rollback (the image that ran before the last deploy)
        if: inputs.action == 'rollback'
        run: $RUN "Rollback" scripts/deploy/web-vps.sh rollback
      - name: Switch (cron, Caddy's certificates; no build)
        if: inputs.action == 'switch'
        run: $RUN "Switch" scripts/deploy/web-vps.sh switch
      - name: Secrets from the SOPS file
        if: inputs.action == 'deploy'
        uses: ./.github/actions/sops-env
        with:
          age-key: ${{ secrets.SOPS_AGE_KEY }}
      - name: Secrets from the Supabase project (keys, vault)
        if: inputs.action == 'deploy'
        run: $RUN "Secrets" scripts/deploy/supabase.sh secrets
      - name: Turnstile keys (read; the widget exists since the first Worker deploy)
        if: inputs.action == 'deploy'
        run: $RUN "Turnstile" scripts/deploy/cloudflare.sh token turnstile
      - name: Settings (public ones for the build, all of them for the server)
        if: inputs.action == 'deploy'
        env:
          PHOTOS_URL: ${{ vars.NEXT_PUBLIC_VEHICLE_PHOTOS_URL }}
          APP_APPLE_TEAM_ID: ${{ vars.APP_APPLE_TEAM_ID }}
          APP_ANDROID_CERT_SHA256: ${{ vars.APP_ANDROID_CERT_SHA256 }}
          RENTALCOVER_API_BASE: ${{ vars.RENTALCOVER_API_BASE }}
        run: |
          set -euo pipefail
          export APP_ENV=production DATA_BACKEND=supabase NEXT_PUBLIC_APP_URL="$APP_URL" PAYMENTS_PROVIDER=stripe VIN_DECODER=vpic QUO_PROVIDER=quo AUTH_OAUTH_PROVIDERS=google
          export MAPS_PROVIDER="${MAPS_PROVIDER:-fake}"
          # files: Supabase Storage on the server (the Worker's R2 bindings do not exist there); photos from its public bucket
          export STORAGE_PROVIDER=supabase
          if [ "${FILES_ON_R2:-no}" = yes ]; then
            # the same buckets the Worker's bindings used, over R2's S3 API: no file is copied
            [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ] && [ -n "${PHOTOS_URL:-}" ] || { echo "::error title=deploy-vps::FILES_ON_R2=yes needs the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY and the variable NEXT_PUBLIC_VEHICLE_PHOTOS_URL (the public bucket's address)"; exit 1; }
            export STORAGE_PROVIDER=r2 R2_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" R2_BUCKET_PREFIX=carmacars-prod-
          fi
          export NEXT_PUBLIC_VEHICLE_PHOTOS_URL="${PHOTOS_URL:-$NEXT_PUBLIC_SUPABASE_URL/storage/v1/object/public/vehicle-public}"
          # AI: Workers AI over REST when the token is there, else the fake (never a failed deploy)
          if [ -n "${WORKERS_AI_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then export LLM_PROVIDER=workers-ai; else export LLM_PROVIDER=fake; echo "::warning title=deploy-vps::WORKERS_AI_API_TOKEN is not set: AI drafts and replies use the fake on the server"; fi
          export PHOTO_PROVIDER=cloudflare
          scripts/deploy/web-vps.sh envfile "$RUNNER_TEMP/web.env"
          # the build reads the same public settings as the Worker build (web/.env.production); no secret is written there
          grep -E "^(APP_ENV|DATA_BACKEND|NEXT_PUBLIC_[A-Z_]+|TURNSTILE_PROVIDER|PAYMENTS_PROVIDER|STORAGE_PROVIDER|MAPS_PROVIDER|VIN_DECODER|LLM_PROVIDER|PHOTO_PROVIDER|QUO_PROVIDER|RENTALCOVER_API_BASE|APP_APPLE_TEAM_ID|APP_ANDROID_CERT_SHA256)=" "$RUNNER_TEMP/web.env" \
            | sed -E "s/^([A-Z0-9_]+)='(.*)'$/\1=\2/" > web/.env.production
      - name: Build the image (Next.js standalone, HOSTING_TARGET=node)
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          tag="${GITHUB_SHA:0:12}"
          # the user guides' images live outside web/ (docs/guides): copied into web/public here, where the image build finds them
          node web/scripts/guide-assets.mjs
          $RUN "Image build" docker build -f infra/vps/web/Dockerfile --build-arg DEPLOY_VERSION="$tag" --secret id=buildenv,src="$RUNNER_TEMP/web.env" -t "carmacars-web:$tag" web
          docker save "carmacars-web:$tag" | gzip > "$RUNNER_TEMP/web-image.tgz"
          echo "WEB_IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "::notice title=deploy-vps::image carmacars-web:$tag, $(du -h "$RUNNER_TEMP/web-image.tgz" | cut -f1) compressed"
      - name: To the server (start, health, Caddy's site file), then /api/health from outside
        if: inputs.action == 'deploy'
        run: $RUN "Server" scripts/deploy/web-vps.sh ship "$RUNNER_TEMP/web-image.tgz" "$RUNNER_TEMP/web.env"
      # Inbound email without Workers Paid: the forwarder is deployed on every deploy (it receives nothing until the rules
      # point at it); a failure only fails the job when the rules are being pointed at it in this run
      - name: Inbound email forwarder (a Worker on Cloudflare's free plan)
        if: inputs.action == 'deploy'
        continue-on-error: ${{ inputs.email != 'forwarder' }}
        run: $RUN "Email forwarder" scripts/deploy/web-vps.sh forwarder
      - name: Inbound email rules (to the forwarder, or back to the website Worker)
        if: inputs.email != 'keep'
        run: $RUN "Email rules" scripts/deploy/web-vps.sh email ${{ inputs.email }}
      - name: Remove the settings file
        if: always()
        run: rm -f "$RUNNER_TEMP/web.env" "$RUNNER_TEMP/web-image.tgz" web/.env.production

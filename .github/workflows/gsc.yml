name: gsc

# Search Console through its API (Oct 23): the OAuth client and refresh token for rent@carmacars.ca live in the vault
# (deploy_gsc_client_id, deploy_gsc_client_secret, deploy_gsc_refresh_token). Lists the properties, submits sitemap.xml and
# the further sitemap index files (Search Console takes at most 500 per property), and reports each one's status.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the sitemaps (false only reports)
        type: boolean
        default: true
      max_index:
        description: Highest /sitemap-index/<n>.xml to submit (Search Console allows 500 sitemaps per property)
        type: string
        default: '480'
      leaf:
        description: Submit the URL-set files directly (priority first) instead of the index files
        type: boolean
        default: false
  schedule:
    - cron: '17 */3 * * *'

jobs:
  gsc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Search Console
        env:
          SUBMIT: ${{ github.event_name == 'schedule' && 'false' || inputs.submit }}
          MAX_INDEX: ${{ inputs.max_index || '480' }}
          LEAF: ${{ inputs.leaf || false }}
        run: |
          set -euo pipefail
          q() { curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' --data "$(jq -n --arg q "$1" '{query:$q}')"; }
          rows=$(q "select name, decrypted_secret v from vault.decrypted_secrets where name in ('deploy_gsc_client_id','deploy_gsc_client_secret','deploy_gsc_refresh_token')")
          get() { jq -r --arg n "$1" '[.[]|select(.name==$n)][0].v // empty' <<<"$rows"; }
          CID=$(get deploy_gsc_client_id); CS=$(get deploy_gsc_client_secret); RT=$(get deploy_gsc_refresh_token)
          echo "::add-mask::$CS"; echo "::add-mask::$RT"
          [ -n "$RT" ] || { echo "::error title=gsc::no refresh token in the vault"; exit 1; }
          AT=$(curl -sS https://oauth2.googleapis.com/token -d client_id="$CID" -d client_secret="$CS" -d refresh_token="$RT" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$AT"
          H=(-H "Authorization: Bearer $AT")
          sites=$(curl -sS "${H[@]}" https://www.googleapis.com/webmasters/v3/sites)
          echo "::notice title=gsc properties::$(jq -c '[.siteEntry[]? | "\(.siteUrl) \(.permissionLevel)"]' <<<"$sites")"
          SITE=$(jq -r '[.siteEntry[]?.siteUrl | select(test("carmacars.ca"))] | (map(select(startswith("sc-domain:")))[0] // .[0]) // empty' <<<"$sites")
          [ -n "$SITE" ] || { echo "::error title=gsc::no carmacars.ca property for this account"; exit 1; }
          ES=$(jq -rn --arg s "$SITE" '$s|@uri')
          # Leaf mode (Oct 23): walk sitemap.xml down to the URL-set files and submit those directly (priority first), after
          # removing submitted index files, so Search Console reads URL lists rather than lists of lists
          root_tag() { curl -sS --max-time 60 -o rt.xml "$1" || true; head -c 600 rt.xml | grep -o '<\(sitemapindex\|urlset\)' | head -1 | tr -d '<' || true; }
          locs() { curl -sS --max-time 90 -o lc.xml "$1" || true; grep -o '<loc>[^<]*</loc>' lc.xml | sed 's#</\?loc>##g' || true; }
          echo "::notice title=structure::sitemap.xml is $(root_tag https://carmacars.ca/sitemap.xml); sitemap-index/2.xml is $(root_tag https://carmacars.ca/sitemap-index/2.xml)"
          if [ "$SUBMIT" = true ] && [ "${LEAF:-false}" = true ]; then
            : > leaves.txt; : > queue.txt
            locs https://carmacars.ca/sitemap.xml > level1.txt
            echo "::notice title=sitemap.xml children::$(wc -l < level1.txt); first $(head -3 level1.txt | tr '\n' ' ') last $(tail -2 level1.txt | tr '\n' ' ')"
            # sitemap.xml is a one-level index of URL-set files (checked Oct 23): its children are the leaves
            { echo https://carmacars.ca/sitemap-priority.xml; cat level1.txt; } > leaves.txt
            grep -i priority leaves.txt > ordered.txt || true; grep -vi priority leaves.txt >> ordered.txt || true
            echo "::notice title=leaves::$(wc -l < ordered.txt) URL-set files found (first: $(head -3 ordered.txt | tr '\n' ' '))"
            # free the property's 500-sitemap quota: delete submitted index files other than sitemap.xml
            cur=$(curl -sS "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps")
            del=0
            for u in $(jq -r '.sitemap[]? | select(.isSitemapsIndex == true) | .path | select(endswith("/sitemap.xml")|not)' <<<"$cur"); do
              curl -sS -o /dev/null -X DELETE "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps/$(jq -rn --arg u "$u" '$u|@uri')"; del=$((del+1)); sleep 0.1
            done
            echo "::notice title=removed::$del submitted index files removed"
            n=0; fail=0
            for u in $(head -n "${LEAF_MAX:-495}" ordered.txt); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps/$(jq -rn --arg u "$u" '$u|@uri')")
              if [ "$code" = 204 ] || [ "$code" = 200 ]; then n=$((n+1)); else fail=$((fail+1)); echo "submit $u -> $code"; fi
              sleep 0.2
            done
            echo "::notice title=gsc leaf submitted::$n URL-set sitemaps submitted, $fail failed"
          elif [ "$SUBMIT" = true ]; then
            n=0; fail=0
            for u in https://carmacars.ca/sitemap.xml $(seq -f 'https://carmacars.ca/sitemap-index/%g.xml' 2 "$MAX_INDEX"); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps/$(jq -rn --arg u "$u" '$u|@uri')")
              if [ "$code" = 204 ] || [ "$code" = 200 ]; then n=$((n+1)); else fail=$((fail+1)); echo "submit $u -> $code"; fi
              sleep 0.2
            done
            echo "::notice title=gsc submitted::$n sitemaps submitted to $SITE, $fail failed"
          fi
          list=$(curl -sS "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps")
          # Google's first fetch of a batch of index files can fail while it fetches hundreds at once: resubmit up to 40
          # failed ones a run, one every 20 s, so each is fetched again on its own
          retry=$(jq -r '[.sitemap[]? | select((.errors|tonumber? // 0) > 0) | .path][0:40][]' <<<"$list")
          r=0
          for u in $retry; do
            curl -sS -o /dev/null -X PUT "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps/$(jq -rn --arg u "$u" '$u|@uri')" && r=$((r+1))
            sleep 20
          done
          [ "$r" -gt 0 ] && echo "::notice title=gsc retried::$r sitemaps with errors resubmitted"
          list=$(curl -sS "${H[@]}" "https://www.googleapis.com/webmasters/v3/sites/$ES/sitemaps")
          echo "::notice title=gsc status::$(jq -c '{count: (.sitemap|length), errors: ([.sitemap[]?|select((.errors|tonumber? // 0)>0)]|length), pending: ([.sitemap[]?|select(.isPending)]|length), first: ([.sitemap[]?|select(.path|endswith("/sitemap.xml"))][0] | {path, lastDownloaded, isPending, errors, warnings, contents})}' <<<"$list")"

name: Full-suite stack
description: >-
  What every job of the full suite starts from (ci.yml): Node and the packages, PostgreSQL 16, the Playwright browser,
  the local stack (every migration, local auth, the seed: test data only), the Worker build and the local production
  server on http://localhost:3000. Each job builds its own (about 4 minutes) so the jobs start at once and run side by
  side; nothing built here is uploaded (the repository is public; the seed is test data in any case).
inputs:
  save-caches:
    description: Save the Playwright browser and Next.js build caches (one job per run, so the parallel jobs do not race)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: web/package-lock.json
    - name: apt uses the Ubuntu archive only (a broken third-party package list failed apt-get update on Nov 11)
      shell: bash
      run: sudo find /etc/apt/sources.list.d -type f ! -name 'ubuntu.sources' -delete || true
    - name: PostgreSQL 16 (preinstalled on the runner image; installed only if missing)
      shell: bash
      run: |
        # retried: an apt mirror hiccup failed every job of several runs on Nov 11 (annotated so the step is named)
        if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
          for i in 1 2 3; do sudo apt-get update -q && sudo apt-get install -y -q postgresql-16 postgresql-client-16 && break; echo "::warning title=full-stack::PostgreSQL install try $i failed"; sleep 20; done
          [ -x /usr/lib/postgresql/16/bin/initdb ] || { echo "::error title=full-stack::PostgreSQL 16 install failed"; exit 1; }
        fi
        echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
    - shell: bash
      working-directory: web
      run: |
        for i in 1 2 3; do npm ci --no-audit --no-fund && exit 0; echo "::warning title=full-stack::npm ci try $i failed"; sleep 15; done
        echo "::error title=full-stack::npm ci failed"; exit 1
    - name: Playwright browser cache
      id: pw
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
    - name: Browsers
      shell: bash
      working-directory: web
      run: |
        # retried, then annotated: an apt mirror failure here left every job without a server on Nov 11
        for i in 1 2 3; do
          if [ "${{ steps.pw.outputs.cache-hit }}" = true ]; then npx playwright install-deps chromium && exit 0; else npx playwright install --with-deps chromium && exit 0; fi
          echo "::warning title=full-stack::browsers try $i failed"; sleep 20
        done
        echo "::error title=full-stack::Playwright browsers failed"; exit 1
    - name: Save the browser cache
      if: inputs.save-caches == 'true' && steps.pw.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
    - name: Next.js build cache
      id: nx
      uses: actions/cache/restore@v4
      with:
        path: web/.next/cache
        key: nextjs-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
        restore-keys: nextjs-${{ hashFiles('web/package-lock.json') }}-
    - name: Local stack (migrations, local auth, seed)
      shell: bash
      working-directory: web
      run: |
        cp .env.example .env.local
        bash scripts/local-db.sh up || { echo "::error title=full-stack::local stack (migrations, seed) failed"; exit 1; }
    - name: Worker build (runs next build)
      # cf:build: the OpenNext build with the Worker size step and its budget check (scripts/worker-size.mjs)
      shell: bash
      working-directory: web
      run: ../.github/ci-run.sh "Worker build" npm run -s cf:build
    - name: Save the Next.js build cache
      if: inputs.save-caches == 'true' && steps.nx.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: web/.next/cache
        key: nextjs-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
    - name: Server
      shell: bash
      working-directory: web
      run: |
        (node scripts/serve.mjs > /tmp/serve.log 2>&1 &)
        for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/robots.txt && break; sleep 1; done
